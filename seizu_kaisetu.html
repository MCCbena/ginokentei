<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機械製図 下線部 94問（寸法記入・ねじ・歯車）</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #475569;
    --primary: #1d4ed8;
    --primary-light: #eff6ff;
    --primary-hover: #1e40af;
    --success: #15803d;
    --success-bg: #f0fdf4;
    --success-border: #86efac;
    --danger: #b91c1c;
    --danger-bg: #fef2f2;
    --danger-border: #fca5a5;
    --warn: #b45309;
    --warn-bg: #fffbeb;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .container { max-width: 1080px; margin: 0 auto; padding: 16px; }
  header.app-header {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    color: #fff;
    padding: 20px 24px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .header-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
  .app-title { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: 0.02em; }
  .app-subtitle { margin: 4px 0 0; font-size: 0.85rem; color: #cbd5e1; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 0.875rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s ease;
  }
  .btn:hover:not(:disabled) { background: #f1f5f9; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-ghost-light { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.25); }
  .btn-ghost-light:hover:not(:disabled) { background: rgba(255,255,255,0.22); }
  .btn-danger-outline { background: #fff; color: var(--danger); border-color: var(--danger-border); }
  .btn-danger-outline:hover:not(:disabled) { background: var(--danger-bg); }
  .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .stat-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
  .stat-value { font-size: 1.4rem; font-weight: 700; margin-top: 2px; color: var(--text); }
  .stat-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .panel-title { font-size: 0.95rem; font-weight: 700; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cat-bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .cat-bar-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .cat-bar-item:hover, .cat-bar-item.active { border-color: var(--primary); background: var(--primary-light); }
  .cat-bar-head { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; }
  .progress-track { height: 7px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.25s ease; }
  .controls-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .control-group { display: flex; flex-direction: column; gap: 4px; min-width: 140px; flex: 1 1 160px; }
  .control-group label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
  select, input[type="text"] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.875rem; background: #fff; color: var(--text); width: 100%; }
  .mode-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .mode-tab { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-muted); }
  .mode-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .q-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .q-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 600; }
  .badge-id { background: #e2e8f0; color: #1e293b; }
  .badge-cat { background: var(--primary-light); color: var(--primary); }
  .badge-type { background: #f3e8ff; color: #6b21a8; }
  .badge-ok { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
  .badge-ng { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
  .bookmark-btn { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; color: var(--text-muted); }
  .bookmark-btn.active { background: var(--warn-bg); color: var(--warn); border-color: #fcd34d; font-weight: 700; }
  .q-text { font-size: 1.02rem; font-weight: 600; margin: 0 0 14px; color: var(--text); }
  .options-list { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 9px; background: #fff; color: var(--text); font-size: 0.92rem; cursor: pointer; transition: all 0.12s ease; }
  .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
  .opt-btn.selected { border-color: var(--primary); background: var(--primary-light); font-weight: 600; }
  .opt-btn.correct { border-color: var(--success); background: var(--success-bg); color: #14532d; font-weight: 600; }
  .opt-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: #7f1d1d; }
  .opt-key { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; border-radius: 6px; background: #f1f5f9; color: #334155; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; }
  .opt-btn.correct .opt-key { background: var(--success); color: #fff; }
  .opt-btn.wrong .opt-key { background: var(--danger); color: #fff; }
  .opt-btn.selected .opt-key { background: var(--primary); color: #fff; }
  .multi-submit-row { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
  .explanation-box { margin-top: 14px; padding: 12px 14px; border-radius: 9px; background: var(--surface-2); border-left: 4px solid var(--primary); font-size: 0.88rem; }
  .explanation-box.ok { border-left-color: var(--success); background: #f0fdf4; }
  .explanation-box.ng { border-left-color: var(--danger); background: #fef2f2; }
  .exp-title { font-weight: 700; margin-bottom: 4px; }
  .nav-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .pagination { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; margin: 16px 0; }
  .mock-setup { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .modal-backdrop.open { display: flex; }
  .modal-box { background: #fff; border-radius: var(--radius); padding: 20px; max-width: 420px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15); }
  .modal-box h3 { margin: 0 0 8px; font-size: 1.05rem; }
  .modal-box p { margin: 0 0 16px; font-size: 0.9rem; color: var(--text-muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .hidden { display: none !important; }
  .empty-state { text-align: center; padding: 40px 16px; color: var(--text-muted); background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--border); }
  @media (max-width: 640px) { .container { padding: 10px; } .q-card { padding: 14px; } .app-title { font-size: 1.15rem; } }
</style>
</head>
<body>
<div class="container">
  <header class="app-header">
    <div class="header-top">
      <div>
        <h1 class="app-title">機械製図 下線部 94問</h1>
        <p class="app-subtitle">JIS B 0001 機械製図法／スキャン13頁で赤・黄の下線を引いた行だけを出題根拠に</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost-light btn-sm" id="toggle-stats-btn" type="button">分野別進捗を表示/非表示</button>
        <button class="btn btn-ghost-light btn-sm" id="open-reset-btn" type="button">学習履歴リセット</button>
      </div>
    </div>
  </header>

  <section class="stats-grid" aria-label="全体サマリー">
    <div class="stat-card"><div class="stat-label">総問題数</div><div class="stat-value" id="stat-total">94</div><div class="stat-sub" id="stat-filtered">表示中: 94問</div></div>
    <div class="stat-card"><div class="stat-label">解答済み</div><div class="stat-value" id="stat-answered">0</div><div class="stat-sub" id="stat-progress">進捗率: 0%</div></div>
    <div class="stat-card"><div class="stat-label">正答数 / 正答率</div><div class="stat-value" id="stat-correct">0</div><div class="stat-sub" id="stat-accuracy">正答率: 0%</div></div>
    <div class="stat-card"><div class="stat-label">ブックマーク</div><div class="stat-value" id="stat-bookmarks">0</div><div class="stat-sub">要復習マーク</div></div>
  </section>

  <section class="panel" id="cat-stats-panel">
    <div class="panel-title"><span>分野別出題分布・進捗（クリックで絞り込み）</span><button class="btn btn-sm" id="clear-cat-btn" type="button">全分野を表示</button></div>
    <div class="cat-bars" id="cat-bars"></div>
  </section>

  <section class="panel">
    <div class="mode-tabs" role="tablist">
      <button class="mode-tab active" data-mode="single" type="button">1問ずつ演習</button>
      <button class="mode-tab" data-mode="list" type="button">一覧リスト表示</button>
      <button class="mode-tab" data-mode="mock" type="button">ランダム模試</button>
    </div>

    <div class="controls-bar" id="filter-controls">
      <div class="control-group">
        <label for="filter-cat">分野</label>
        <select id="filter-cat">
          <option value="all">すべての分野 (94問)</option>
          <option value="1">① 寸法記入の一般原則 (14問)</option>
          <option value="2">② 寸法補助線・寸法線 (9問)</option>
          <option value="3">③ 寸法数値の記入 (11問)</option>
          <option value="4">④ 端末記号・寸法記号 (4問)</option>
          <option value="5">⑤ 直径・半径・球・正方形 (11問)</option>
          <option value="6">⑥ 穴・座ぐり・キー溝 (11問)</option>
          <option value="7">⑦ 弦・円弧・面取り・曲線 (10問)</option>
          <option value="8">⑧ ねじの図示 (12問)</option>
          <option value="9">⑨ 歯車の図示 (8問)</option>
          <option value="10">⑩ 溶接・その他 (4問)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="filter-type">出題形式</label>
        <select id="filter-type">
          <option value="all">すべての形式</option>
          <option value="s">単一選択</option>
          <option value="ox">○×問題</option>
          <option value="m">複数選択</option>
        </select>
      </div>
      <div class="control-group">
        <label for="filter-status">解答状態</label>
        <select id="filter-status">
          <option value="all">すべて</option>
          <option value="unanswered">未解答のみ</option>
          <option value="wrong">不正解のみ</option>
          <option value="correct">正解のみ</option>
          <option value="bookmark">ブックマークのみ</option>
        </select>
      </div>
      <div class="control-group">
        <label for="filter-search">キーワード検索</label>
        <input type="text" id="filter-search" placeholder="例: ツェナー, オペアンプ, dB...">
      </div>
    </div>

    <div class="mock-setup hidden" id="mock-controls">
      <div class="control-group" style="max-width:180px;">
        <label for="mock-count">出題数</label>
        <select id="mock-count">
          <option value="10">10問（ミニテスト）</option>
          <option value="30" selected>30問（標準テスト）</option>
          <option value="50">50問（実力テスト）</option>
          <option value="100">100問（総仕上げ）</option>
        </select>
      </div>
      <div class="control-group" style="max-width:240px;">
        <label for="mock-cat">出題範囲</label>
        <select id="mock-cat">
          <option value="all">全分野から分布比率で出題</option>
          <option value="1">① 寸法記入の一般原則</option>
          <option value="2">② 寸法補助線・寸法線</option>
          <option value="3">③ 寸法数値の記入</option>
          <option value="4">④ 端末記号・寸法記号</option>
          <option value="5">⑤ 直径・半径・球・正方形</option>
          <option value="6">⑥ 穴・座ぐり・キー溝</option>
          <option value="7">⑦ 弦・円弧・面取り・曲線</option>
          <option value="8">⑧ ねじの図示</option>
          <option value="9">⑨ 歯車の図示</option>
          <option value="10">⑩ 溶接・その他</option>
        </select>
      </div>
      <button class="btn btn-primary" id="start-mock-btn" type="button">模試を開始する</button>
      <span id="mock-status-text" style="font-size:0.85rem;color:var(--text-muted);"></span>
    </div>
  </section>

  <main id="quiz-area"></main>
  <div id="pagination-area" class="pagination"></div>
</div>

<div class="modal-backdrop" id="reset-modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3>学習履歴をリセットしますか？</h3>
    <p>すべての解答履歴とブックマークが消去されます。この操作は取り消せません。</p>
    <div class="modal-actions">
      <button class="btn" id="cancel-reset-btn" type="button">キャンセル</button>
      <button class="btn btn-danger-outline" id="confirm-reset-btn" type="button">リセットする</button>
    </div>
  </div>
</div>

<script>
const CATEGORIES = {
  1: { name: "① 寸法記入の一般原則", target: 14 },
  2: { name: "② 寸法補助線・寸法線", target: 9 },
  3: { name: "③ 寸法数値の記入", target: 11 },
  4: { name: "④ 端末記号・寸法記号", target: 4 },
  5: { name: "⑤ 直径・半径・球・正方形", target: 11 },
  6: { name: "⑥ 穴・座ぐり・キー溝", target: 11 },
  7: { name: "⑦ 弦・円弧・面取り・曲線", target: 10 },
  8: { name: "⑧ ねじの図示", target: 12 },
  9: { name: "⑨ 歯車の図示", target: 8 },
  10: { name: "⑩ 溶接・その他", target: 4 }
};

const RAW_QUESTIONS = [
  [1, "ox", "図面に示す寸法は、対象物の大きさ・姿勢および位置を最も明らかに表わすのに、必要で十分なものを記入する。", null, 0, "一般原則②。寸法は必要にして十分、過不足なく記入します。"],
  [1, "ox", "対象物の機能・製作・組立などは考えず、外形の寸法だけを図面に記入する。", null, 1, "対象物の機能・製作・組立などを考えて、必要と思われる寸法を明瞭に記入します。"],
  [1, "ox", "同じ対象物の寸法は、読み間違いを防ぐため2箇所に重複して記入する。", null, 1, "寸法の重複記入は避けます。"],
  [1, "s", "参考寸法については、寸法数値をどのように示すか。", ["寸法数値を斜線で消す", "寸法数値に（ ）をつけて示す", "寸法数値を赤字で書く", "寸法数値に下線をつけて示す"], 1, "参考寸法は寸法数値に（ ）を付けて示します。"],
  [1, "ox", "寸法は、計算して求めることを前提に記入する。", null, 1, "寸法は、なるべく計算して求める必要のないように記入します。"],
  [1, "s", "対象物の寸法の基準とする形状がある場合、寸法はどこから記入するか。", ["中心線から必ず離す", "任意の辺から", "図枠から記入", "その基準とする形状から記入"], 3, "基準とする形状がある場は、その基準形状から記入します。"],
  [1, "ox", "参考寸法は、角括弧［　］で囲んで示す。", null, 1, "参考寸法は（　）で示します。"],
  [1, "s", "図面の寸法は、なるべくどこに記入するか。", ["斜視図に記入", "どの図でもよい", "主投影図に集中して記入", "断面図に集中して記入"], 2, "「なるべく主投影図に集中して記入する」が下線部です。"],
  [1, "ox", "同じ対象物に対して、関連する寸法はなるべく1箇所にまとめて記入する。", null, 0, "関連する寸法は1箇所にまとめるのが原則です。"],
  [1, "s", "機械加工を施す部分や金網、しま鋼板などの材料の表示方法は、何に規定されているか。", ["JIS B 0005", "JIS B 0001", "JIS C 0003", "ISO 128"], 1, "加工部・材料の表示方法、加工前/加工後の図示法はJIS B 0001に規定されています。"],
  [1, "s", "90°以内の円弧でも必要があれば記入できる寸法はどれか。", ["角度の寸法のみ", "厚さの寸法", "半径のみ", "直径の寸法"], 3, "90°以内でも必要があれば直径の寸法を記入します。"],
  [1, "ox", "寸法記入のとき、対象物の機能・製作・組立などを考えて適切に記入する。", null, 0, "これは一般原則の冒頭に下線が引かれている文章です。"],
  [1, "s", "溶接部材の重なりや溶接の種類・大きさを表わす場合に用いるのは何か。", ["寸法記号", "表面の荒さ記号", "溶接記号", "照査記号"], 2, "溶接構造部材の重なり・種類・大きさは溶接記号で表わします。"],
  [1, "s", "図面に見出しなどの寸法を記入する場合は、何によって記入するか。", ["中心線からの距離のみで", "適宜記入してよい", "必ず規格値のみで", "必ず計算して"], 1, "対象物の機能・製作・組立を考え、必要と思われる範囲で適宜記入します。"],
  [2, "ox", "同一図面で関連する複数の寸法は、図面の四方に分散して記入する。", null, 1, "関連する寸法はなるべく1箇所に集めて記入します。"],
  [2, "ox", "2つの面の交わる位置を示すには、丸みまたは面取りを施す以前の形状を表わし、その交点から寸法補助線を引き出す。", null, 0, "面取り/丸みの前の交点を想定し、その交点から補助線を引き出します。"],

const RAW_SHUFFLED = (() => {
  let rnd;
  try {
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    rnd = () => { crypto.getRandomValues(buf); return buf[0] / 4294967296; };
  } catch (e) {
    let s = (Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0;
    rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  const shuf = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  return shuf(RAW_QUESTIONS.map((r) => {
    if (r[1] !== "s") return r.slice();
    const opts = r[3], correct = opts[r[4]];
    const rest = shuf(opts.filter((o, j) => j !== r[4]));
    const na = Math.floor(rnd() * opts.length);
    const no = rest.slice(); no.splice(na, 0, correct);
    return [r[0], r[1], r[2], no, na, r[5]];
  }));
})();

  opts: r[3] || ["○", "×"],
  ans: r[4],
  exp: r[5]
}));

(function () {
  const a = new Uint32Array(1);
  try { crypto.getRandomValues(a); } catch (e) { a[0] = Date.now() >>> 0; }
  let s = a[0] >>> 0 || 1;
  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  for (let i = QUESTIONS.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = QUESTIONS[i]; QUESTIONS[i] = QUESTIONS[j]; QUESTIONS[j] = t;
  }
})();

const BY_ID = {};
QUESTIONS.forEach((q) => { BY_ID[q.id] = q; });

const TYPE_LABELS = { s: "単一選択", ox: "○×問題", m: "複数選択" };
const KEYS = ["A", "B", "C", "D", "E", "F"];
const STORAGE_KEY = "kikai_seizu_underline_v3";

let state = {
  mode: "single",
  filterCat: "all",
  filterType: "all",
  filterStatus: "all",
  search: "",
  currentIdx: 0,
  listPage: 1,
  pageSize: 25,
  answers: {},      // { [id]: { sel: number|number[], ok: boolean } }
  bookmarks: {},    // { [id]: true }
  multiDraft: {},   // { [id]: number[] }
  mockIds: [],
  mockIdx: 0,
  mockAnswers: {},  // { [id]: { sel: number|number[], ok: boolean } }
  mockFinished: false
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        state.answers = parsed.answers || {};
        state.bookmarks = parsed.bookmarks || {};
      }
    }
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      answers: state.answers,
      bookmarks: state.bookmarks
    }));
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isCorrectSelection(q, sel) {
  if (q.type === "m") {
    if (!Array.isArray(sel) || sel.length === 0) return false;
    const a = [...q.ans].sort((x, y) => x - y);
    const b = [...sel].sort((x, y) => x - y);
    return a.length === b.length && a.every((v, i) => v === b[i]);
  }
  return sel === q.ans;
}

function getFilteredQuestions() {
  const kw = state.search.trim().toLowerCase();
  return QUESTIONS.filter(q => {
    if (state.filterCat !== "all" && String(q.cat) !== state.filterCat) return false;
    if (state.filterType !== "all" && q.type !== state.filterType) return false;
    const ansRec = state.answers[q.id];
    if (state.filterStatus === "unanswered" && ansRec) return false;
    if (state.filterStatus === "correct" && (!ansRec || !ansRec.ok)) return false;
    if (state.filterStatus === "wrong" && (!ansRec || ansRec.ok)) return false;
    if (state.filterStatus === "bookmark" && !state.bookmarks[q.id]) return false;
    if (kw) {
      const hay = (q.q + " " + q.opts.join(" ") + " " + q.exp).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });
}

function updateSummaryStats(filteredCount) {
  const total = QUESTIONS.length;
  const ansList = Object.values(state.answers);
  const answered = ansList.length;
  const correct = ansList.filter(a => a.ok).length;
  const bmCount = Object.keys(state.bookmarks).length;

  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-filtered").textContent = "表示中: " + filteredCount + "問";
  document.getElementById("stat-answered").textContent = answered;
  document.getElementById("stat-progress").textContent = "進捗率: " + (total ? Math.round((answered / total) * 100) : 0) + "%";
  document.getElementById("stat-correct").textContent = correct;
  document.getElementById("stat-accuracy").textContent = "正答率: " + (answered ? Math.round((correct / answered) * 100) : 0) + "%";
  document.getElementById("stat-bookmarks").textContent = bmCount;

  const barsEl = document.getElementById("cat-bars");
  barsEl.innerHTML = Object.keys(CATEGORIES).map(catKey => {
    const cNum = Number(catKey);
    const qs = QUESTIONS.filter(q => q.cat === cNum);
    const done = qs.filter(q => state.answers[q.id]).length;
    const ok = qs.filter(q => state.answers[q.id] && state.answers[q.id].ok).length;
    const pct = qs.length ? Math.round((done / qs.length) * 100) : 0;
    const activeCls = state.filterCat === String(cNum) ? "active" : "";
    return `
      <div class="cat-bar-item ${activeCls}" data-cat="${cNum}">
        <div class="cat-bar-head">
          <span>${escapeHtml(CATEGORIES[cNum].name)}</span>
          <span>${done}/${qs.length} (正答${ok})</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join("");
}

function renderQuestionCard(q, ansSource, isMock) {
  const ansRec = ansSource[q.id];
  const isBm = !!state.bookmarks[q.id];
  const draft = state.multiDraft[q.id] || [];

  let statusBadge = "";
  if (ansRec) {
    statusBadge = ansRec.ok
      ? `<span class="badge badge-ok">正解</span>`
      : `<span class="badge badge-ng">不正解</span>`;
  }

  const optionsHtml = q.opts.map((opt, idx) => {
    let cls = "opt-btn";
    const disabled = !!ansRec;
    if (ansRec) {
      const isRightOpt = q.type === "m" ? q.ans.includes(idx) : q.ans === idx;
      const isUserSel = q.type === "m" ? ansRec.sel.includes(idx) : ansRec.sel === idx;
      if (isRightOpt) cls += " correct";
      else if (isUserSel) cls += " wrong";
    } else if (q.type === "m" && draft.includes(idx)) {
      cls += " selected";
    }
    return `
      <button type="button" class="${cls}" data-qid="${q.id}" data-oidx="${idx}" ${disabled ? "disabled" : ""}>
        <span class="opt-key">${KEYS[idx] || (idx + 1)}</span>
        <span>${escapeHtml(opt)}</span>
      </button>
    `;
  }).join("");

  let multiSubmitHtml = "";
  if (q.type === "m" && !ansRec) {
    multiSubmitHtml = `
      <div class="multi-submit-row">
        <button type="button" class="btn btn-primary btn-sm submit-multi-btn" data-qid="${q.id}" ${draft.length === 0 ? "disabled" : ""}>選択した項目で回答する</button>
        <span style="font-size:0.8rem;color:var(--text-muted);">複数選択可（${draft.length}個選択中）</span>
      </div>
    `;
  }

  let expHtml = "";
  if (ansRec) {
    const ansLabel = q.type === "m"
      ? q.ans.map(i => KEYS[i]).join(", ")
      : KEYS[q.ans] + "（" + escapeHtml(q.opts[q.ans]) + "）";
    expHtml = `
      <div class="explanation-box ${ansRec.ok ? "ok" : "ng"}">
        <div class="exp-title">${ansRec.ok ? "〇 正解！" : "× 不正解"} 正解：${ansLabel}</div>
        <div>${escapeHtml(q.exp)}</div>
      </div>
    `;
  }

  return `
    <article class="q-card" data-card-qid="${q.id}">
      <div class="q-meta">
        <div class="q-badges">
          <span class="badge badge-id">Q${q.id}</span>
          <span class="badge badge-cat">${escapeHtml(CATEGORIES[q.cat].name)}</span>
          <span class="badge badge-type">${TYPE_LABELS[q.type]}</span>
          ${statusBadge}
        </div>
        <button type="button" class="bookmark-btn ${isBm ? "active" : ""}" data-bm-qid="${q.id}">
          ${isBm ? "★ ブックマーク済" : "☆ ブックマーク"}
        </button>
      </div>
      <p class="q-text">${escapeHtml(q.q)}</p>
      <div class="options-list">${optionsHtml}</div>
      ${multiSubmitHtml}
      ${expHtml}
    </article>
  `;
}

function render() {
  const filtered = getFilteredQuestions();
  updateSummaryStats(filtered.length);

  const area = document.getElementById("quiz-area");
  const pagArea = document.getElementById("pagination-area");
  pagArea.innerHTML = "";

  if (state.mode === "mock") {
    renderMockMode(area);
    return;
  }

  if (filtered.length === 0) {
    area.innerHTML = `<div class="empty-state">条件に一致する問題がありません。フィルターや検索条件を変更してください。</div>`;
    return;
  }

  if (state.mode === "single") {
    if (state.currentIdx >= filtered.length) state.currentIdx = 0;
    if (state.currentIdx < 0) state.currentIdx = 0;
    const q = filtered[state.currentIdx];
    area.innerHTML = renderQuestionCard(q, state.answers, false) + `
      <div class="nav-footer">
        <button type="button" class="btn" id="prev-q-btn" ${state.currentIdx === 0 ? "disabled" : ""}>← 前の問題</button>
        <span style="font-size:0.85rem;color:var(--text-muted);font-weight:600;">${state.currentIdx + 1} / ${filtered.length} 問目</span>
        <button type="button" class="btn btn-primary" id="next-q-btn" ${state.currentIdx >= filtered.length - 1 ? "disabled" : ""}>次の問題 →</button>
      </div>
    `;
  } else {
    const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    if (state.listPage > totalPages) state.listPage = totalPages;
    const start = (state.listPage - 1) * state.pageSize;
    const slice = filtered.slice(start, start + state.pageSize);
    area.innerHTML = slice.map(q => renderQuestionCard(q, state.answers, false)).join("");

    if (totalPages > 1) {
      let pagHtml = `<button type="button" class="btn btn-sm" data-page="${state.listPage - 1}" ${state.listPage === 1 ? "disabled" : ""}>前へ</button>`;
      for (let p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || Math.abs(p - state.listPage) <= 2) {
          pagHtml += `<button type="button" class="btn btn-sm ${p === state.listPage ? "btn-primary" : ""}" data-page="${p}">${p}</button>`;
        } else if (Math.abs(p - state.listPage) === 3) {
          pagHtml += `<span style="color:var(--text-muted);">...</span>`;
        }
      }
      pagHtml += `<button type="button" class="btn btn-sm" data-page="${state.listPage + 1}" ${state.listPage === totalPages ? "disabled" : ""}>次へ</button>`;
      pagArea.innerHTML = pagHtml;
    }
  }
}

function renderMockMode(area) {
  const statusEl = document.getElementById("mock-status-text");
  if (state.mockIds.length === 0) {
    statusEl.textContent = "";
    area.innerHTML = `<div class="empty-state">上の「模試を開始する」ボタンを押すと、ランダムに問題を出題します。</div>`;
    return;
  }
  const doneCount = Object.keys(state.mockAnswers).length;
  statusEl.textContent = `解答済み: ${doneCount} / ${state.mockIds.length} 問`;

  if (state.mockFinished) {
    const okCount = Object.values(state.mockAnswers).filter(a => a.ok).length;
    const pct = Math.round((okCount / state.mockIds.length) * 100);
    area.innerHTML = `
      <div class="panel">
        <h2 style="margin-top:0;">模試結果レポート</h2>
        <p style="font-size:1.1rem;font-weight:700;">スコア: ${okCount} / ${state.mockIds.length} 問正解（正答率 ${pct}%）</p>
        <button type="button" class="btn btn-primary" id="mock-review-btn">全問の解答・解説を確認する</button>
      </div>
    ` + state.mockIds.map(id => renderQuestionCard(BY_ID[id], state.mockAnswers, true)).join("");
    return;
  }

  const q = BY_ID[state.mockIds[state.mockIdx]];
  area.innerHTML = renderQuestionCard(q, state.mockAnswers, true) + `
    <div class="nav-footer">
      <button type="button" class="btn" id="mock-prev-btn" ${state.mockIdx === 0 ? "disabled" : ""}>← 前の問題</button>
      <span style="font-size:0.85rem;color:var(--text-muted);font-weight:600;">模試 ${state.mockIdx + 1} / ${state.mockIds.length} 問目</span>
      ${state.mockIdx < state.mockIds.length - 1
        ? `<button type="button" class="btn btn-primary" id="mock-next-btn">次の問題 →</button>`
        : `<button type="button" class="btn btn-primary" id="mock-finish-btn">採点・結果を見る</button>`
      }
    </div>
  `;
}

function startMock() {
  const count = Number(document.getElementById("mock-count").value);
  const cat = document.getElementById("mock-cat").value;
  let pool = cat === "all" ? [...QUESTIONS] : QUESTIONS.filter(q => String(q.cat) === cat);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  state.mockIds = pool.slice(0, Math.min(count, pool.length)).map(q => q.id);
  state.mockIdx = 0;
  state.mockAnswers = {};
  state.mockFinished = false;
  render();
}

function handleAnswer(qid, sel) {
  const q = BY_ID[qid];
  const ok = isCorrectSelection(q, sel);
  if (state.mode === "mock") {
    state.mockAnswers[qid] = { sel, ok };
  }
  state.answers[qid] = { sel, ok };
  delete state.multiDraft[qid];
  saveState();
  render();
}

document.addEventListener("click", (e) => {
  const optBtn = e.target.closest(".opt-btn");
  if (optBtn && !optBtn.disabled) {
    const qid = Number(optBtn.dataset.qid);
    const oidx = Number(optBtn.dataset.oidx);
    const q = BY_ID[qid];
    if (q.type === "m") {
      const cur = state.multiDraft[qid] || [];
      state.multiDraft[qid] = cur.includes(oidx) ? cur.filter(x => x !== oidx) : [...cur, oidx];
      render();
    } else {
      handleAnswer(qid, oidx);
    }
    return;
  }

  const multiBtn = e.target.closest(".submit-multi-btn");
  if (multiBtn) {
    const qid = Number(multiBtn.dataset.qid);
    const draft = state.multiDraft[qid] || [];
    if (draft.length > 0) handleAnswer(qid, draft);
    return;
  }

  const bmBtn = e.target.closest(".bookmark-btn");
  if (bmBtn) {
    const qid = Number(bmBtn.dataset.bmQid);
    if (state.bookmarks[qid]) delete state.bookmarks[qid];
    else state.bookmarks[qid] = true;
    saveState();
    render();
    return;
  }

  const catCard = e.target.closest(".cat-bar-item");
  if (catCard) {
    const c = catCard.dataset.cat;
    state.filterCat = (state.filterCat === c) ? "all" : c;
    document.getElementById("filter-cat").value = state.filterCat;
    state.currentIdx = 0;
    state.listPage = 1;
    render();
    return;
  }

  const pagBtn = e.target.closest("[data-page]");
  if (pagBtn && !pagBtn.disabled) {
    state.listPage = Number(pagBtn.dataset.page);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  if (e.target.id === "prev-q-btn") { state.currentIdx--; render(); }
  else if (e.target.id === "next-q-btn") { state.currentIdx++; render(); }
  else if (e.target.id === "mock-prev-btn") { state.mockIdx--; render(); }
  else if (e.target.id === "mock-next-btn") { state.mockIdx++; render(); }
  else if (e.target.id === "mock-finish-btn") { state.mockFinished = true; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (e.target.id === "mock-review-btn") {
    const first = document.querySelector(".q-card");
    if (first) first.scrollIntoView({ behavior: "smooth" });
  }
});

document.querySelectorAll(".mode-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".mode-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    state.mode = tab.dataset.mode;
    document.getElementById("filter-controls").classList.toggle("hidden", state.mode === "mock");
    document.getElementById("mock-controls").classList.toggle("hidden", state.mode !== "mock");
    render();
  });
});

document.getElementById("filter-cat").addEventListener("change", (e) => {
  state.filterCat = e.target.value; state.currentIdx = 0; state.listPage = 1; render();
});
document.getElementById("filter-type").addEventListener("change", (e) => {
  state.filterType = e.target.value; state.currentIdx = 0; state.listPage = 1; render();
});
document.getElementById("filter-status").addEventListener("change", (e) => {
  state.filterStatus = e.target.value; state.currentIdx = 0; state.listPage = 1; render();
});
document.getElementById("filter-search").addEventListener("input", (e) => {
  state.search = e.target.value; state.currentIdx = 0; state.listPage = 1; render();
});
document.getElementById("clear-cat-btn").addEventListener("click", () => {
  state.filterCat = "all"; document.getElementById("filter-cat").value = "all"; state.currentIdx = 0; state.listPage = 1; render();
});
document.getElementById("toggle-stats-btn").addEventListener("click", () => {
  document.getElementById("cat-stats-panel").classList.toggle("hidden");
});
document.getElementById("start-mock-btn").addEventListener("click", startMock);

const modal = document.getElementById("reset-modal");
document.getElementById("open-reset-btn").addEventListener("click", () => modal.classList.add("open"));
document.getElementById("cancel-reset-btn").addEventListener("click", () => modal.classList.remove("open"));
document.getElementById("confirm-reset-btn").addEventListener("click", () => {
  state.answers = {};
  state.bookmarks = {};
  state.multiDraft = {};
  state.mockAnswers = {};
  saveState();
  modal.classList.remove("open");
  render();
});

document.addEventListener("keydown", (e) => {
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (state.mode === "single") {
    const filtered = getFilteredQuestions();
    if (e.key === "ArrowRight" && state.currentIdx < filtered.length - 1) { state.currentIdx++; render(); }
    else if (e.key === "ArrowLeft" && state.currentIdx > 0) { state.currentIdx--; render(); }
  }
});

loadState();
render();
</script>
</body>
</html>
