<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電子機器 組立て 問題集</title>
<style>
  :root{
    --bg:#0f1729; --panel:#182236; --panel2:#1f2c45; --line:#2c3a58;
    --text:#e8edf6; --muted:#9fb0cc; --accent:#4f8cff; --accent2:#7c5cff;
    --ok:#2ecc71; --okbg:#123524; --ng:#ff5c6c; --ngbg:#3a1620; --chip:#26344f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    background:linear-gradient(160deg,#0b1220,#131d33 60%,#0e1730);
    color:var(--text); min-height:100vh; line-height:1.7;
  }
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 80px}
  header.hero{
    text-align:center;padding:28px 18px;border-radius:18px;margin-bottom:22px;
    background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(124,92,255,.15));
    border:1px solid var(--line);
  }
  .hero h1{margin:0 0 6px;font-size:1.7rem;letter-spacing:.02em}
  .hero p{margin:0;color:var(--muted);font-size:.95rem}
  .badge{display:inline-block;margin-top:12px;font-size:.78rem;color:var(--muted);
    background:var(--chip);padding:4px 12px;border-radius:999px;border:1px solid var(--line)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  h2.section{font-size:1.05rem;margin:0 0 14px}
  .cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .cat{
    text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--panel2);
    color:var(--text);border-radius:12px;padding:12px 14px;transition:.15s;font-size:.92rem;
    display:flex;justify-content:space-between;align-items:center;gap:8px
  }
  .cat:hover{border-color:var(--accent);transform:translateY(-1px)}
  .cat .n{color:var(--muted);font-size:.78rem;background:var(--chip);padding:2px 9px;border-radius:999px;white-space:nowrap}
  .cat.all{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;grid-column:1/-1;justify-content:center;font-weight:700}
  .opts-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center;color:var(--muted);font-size:.85rem}
  .opts-row label{display:flex;gap:6px;align-items:center;cursor:pointer;background:var(--panel2);border:1px solid var(--line);padding:6px 12px;border-radius:999px}

  .options{list-style:none;padding:0;margin:16px 0 0}
  .opt{
    border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:13px 15px;margin-bottom:10px;
    cursor:pointer;transition:.12s;display:flex;gap:12px;align-items:flex-start
  }
  .opt:hover:not(.disabled){border-color:var(--accent);background:#243352}
  .opt .k{flex:0 0 26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:.85rem;color:var(--muted);border:1px solid var(--line)}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.correct .k{background:var(--ok);color:#062;border-color:var(--ok)}
  .opt.wrong{background:var(--ngbg);border-color:var(--ng)}
  .opt.wrong .k{background:var(--ng);color:#400;border-color:var(--ng)}
  .opt.disabled{cursor:default}

  .qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.82rem;margin-bottom:8px}
  .qtag{background:var(--chip);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
  .qtext{font-size:1.12rem;font-weight:600;margin:4px 0 2px}

  .explain{margin-top:16px;padding:14px 16px;border-radius:12px;background:#101a2e;border-left:4px solid var(--accent);display:none;font-size:.93rem}
  .explain.show{display:block;animation:fade .3s}
  .explain b{color:var(--accent)}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

  .bar{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:6px 0 2px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s}

  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  button.btn{
    cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);
    border-radius:10px;padding:11px 20px;font-size:.95rem;transition:.15s;font-weight:600
  }
  button.btn:hover{border-color:var(--accent)}
  button.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none}
  button.btn:disabled{opacity:.4;cursor:not-allowed}

  .result{text-align:center}
  .score{font-size:3rem;font-weight:800;margin:6px 0;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .grade{font-size:1.2rem;margin-bottom:10px}
  .hidden{display:none}
  .foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:30px}
  @media(max-width:600px){.hero h1{font-size:1.35rem}.qtext{font-size:1rem}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>⚡ 電子機器 組立て 問題集</h1>
    <p>半導体・回路部品・基礎電子回路・製図 — 4択クイズ</p>
    <div class="badge" id="totalBadge"></div>
  </header>

  <section class="card" id="startScreen">
    <h2 class="section">分野を選んでスタート</h2>
    <div class="cats" id="catList"></div>
    <div class="opts-row">
      <span>出題数：</span>
      <label><input type="radio" name="qcount" value="10">10問</label>
      <label><input type="radio" name="qcount" value="20" checked>20問</label>
      <label><input type="radio" name="qcount" value="30">30問</label>
      <label><input type="radio" name="qcount" value="0">全問</label>
    </div>
  </section>

  <section class="card hidden" id="quizScreen">
    <div class="qmeta">
      <span id="progressText"></span>
      <span class="qtag" id="catTag"></span>
    </div>
    <div class="bar"><i id="progBar"></i></div>
    <div class="qtext" id="qText"></div>
    <ul class="options" id="optList"></ul>
    <div class="explain" id="explainBox"></div>
    <div class="row">
      <button class="btn" id="quitBtn">やめる</button>
      <button class="btn primary" id="nextBtn" disabled>次へ →</button>
    </div>
  </section>

  <section class="card hidden result" id="resultScreen">
    <h2 class="section">結果</h2>
    <div class="score" id="scoreText">0 / 0</div>
    <div class="grade" id="gradeText"></div>
    <div class="bar"><i id="scoreBar"></i></div>
    <div id="reviewList" style="margin-top:18px;text-align:left"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="retryBtn">同じ設定でもう一度</button>
      <button class="btn primary" id="homeBtn">分野選択へ戻る</button>
    </div>
  </section>

  <div class="foot">参考テキスト『電子機器組立て』章立てに基づく学習用問題集 / このHTML 1枚で動作します</div>
</div>

<script>
/* ===== 問題データ =====
   add("分野", [ [問題文, [選択肢...], 正解index, 解説], ... ]) */
const QUESTIONS = [];
function add(cat, arr){ arr.forEach(x=>QUESTIONS.push({cat:cat, q:x[0], opts:x[1], a:x[2], ex:x[3]})); }

add("半導体の性質", [
["N形半導体の多数キャリアはどれか。",["電子","ホール(正孔)","陽イオン","陰イオン"],0,"N形半導体は<b>電子</b>が多数キャリア。ホールが少数キャリア。"],
["P形半導体の多数キャリアはどれか。",["電子","ホール(正孔)","中性子","光子"],1,"P形半導体は<b>ホール(正孔)</b>が多数キャリアで、電子が少数キャリア。"],
["N形半導体の少数キャリアはどれか。",["電子","ホール(正孔)","陽子","イオン"],1,"N形の多数キャリアは電子、<b>少数キャリアはホール</b>。"],
["P形半導体の少数キャリアはどれか。",["ホール","電子","陽イオン","中性子"],1,"P形の多数キャリアはホール、<b>少数キャリアは電子</b>。"],
["N形半導体をつくるために加える不純物を何と呼ぶか。",["アクセプタ","ドナー","キャリア","ホール"],1,"N形に入れる不純物を<b>ドナー</b>という。"],
["P形半導体をつくるために加える不純物を何と呼ぶか。",["ドナー","アクセプタ","キャリア","バリスタ"],1,"P形に入れる不純物を<b>アクセプタ</b>という。"],
["ドナーとして使われる元素の原子価はどれか。",["3価","4価","5価","6価"],2,"ドナーは<b>5価</b>（ヒ素As・アンチモンSbなど）。余った電子がキャリアになる。"],
["アクセプタとして使われる元素の原子価はどれか。",["3価","4価","5価","6価"],0,"アクセプタは<b>3価</b>（ホウ素B・インジウムInなど）。"],
["真性半導体の別名はどれか。",["I形半導体","N形半導体","P形半導体","M形半導体"],0,"真性半導体は<b>I形半導体</b>とも呼ばれる。"],
["真性半導体の特徴として正しいものはどれか。",["電子だけが存在","ホールだけが存在","伝導電子とホールの数が常に等しい","不純物が非常に多い"],2,"真性半導体は<b>伝導電子とホールの数が常に等しい</b>純度の高い半導体。"],
["半導体の材料として代表的な元素の組合せはどれか。",["鉄と銅","ゲルマニウムとシリコン","アルミと亜鉛","金と銀"],1,"半導体材料には<b>ゲルマニウム(Ge)やシリコン(Si)</b>が用いられる。"],
["シリコン(Si)の原子価はいくつか。",["2価","3価","4価","5価"],2,"シリコンは電子の数（原子価）が<b>4価</b>で、隣接原子と共有結合する。"],
["共有結合において電子が抜け出した部分を何というか。",["ドナー","ホール(正孔)","キャリア","バンド"],1,"電子の抜けがらを<b>ホール(正孔)</b>という。"],
["ホール(正孔)は電界に対してどの向きに見かけ上移動するか。",["電界と同じ方向","電界と逆方向","移動しない","ランダム"],0,"伝導電子は電界と逆方向、<b>ホールは電界と同じ方向</b>に見かけ上移動する。"],
["伝導電子(自由電子)は電界に対してどの向きに移動するか。",["電界と同じ方向","電界と逆方向","移動しない","垂直方向"],1,"伝導電子は加えられた<b>電界と逆方向</b>に移動する。"],
["半導体結晶で隣接原子が電子を共有し合う結合を何というか。",["イオン結合","金属結合","共有結合","水素結合"],2,"半導体はダイヤモンド構造の<b>共有結合</b>を形成している。"],
["電気伝導を担うもの（電子やホール）を総称して何と呼ぶか。",["ドナー","キャリア","アクセプタ","バンド"],1,"電気伝導をするものを<b>キャリア</b>と呼ぶ。"],
["真性半導体に微量の不純物を入れて作る半導体を何というか。",["真性半導体","不純物半導体","超伝導体","絶縁体"],1,"不純物を加えたものを<b>不純物半導体</b>といい、N形・P形がある。"],
["不純物半導体の抵抗率を決める主な要因はどれか。",["温度だけ","不純物の混入量","結晶の色","外形の大きさ"],1,"伝導電子やホールの量は<b>不純物の混入量</b>で決まり、希望する抵抗率にできる。"],
["実際にトランジスタに主に使われる半導体はどちらか。",["真性半導体","不純物半導体","絶縁体","導体"],1,"トランジスタに使われるのは主に<b>不純物半導体</b>。"],
["N形半導体は全体として電気的にどうなっているか。",["正に帯電","負に帯電","中性","不定"],2,"多数キャリアの電子は多いが、原子核の正電荷と釣り合い全体は<b>中性</b>。"],
["半導体の抵抗は一般に温度が上がるとどうなるか。",["増加する","減少する","変化しない","ゼロになる"],1,"半導体は温度が上がるとキャリアが増え、抵抗は<b>減少</b>する（金属と逆）。"],
["ホールが正の電荷をもつように振る舞うのはなぜか。",["電子が過剰だから","電子が抜けた場所だから","陽子が動くから","中性子の作用"],1,"ホールは<b>電子が抜けた場所</b>で、相対的に正電荷をもつように振る舞う。"],
["N形とP形の違いを決める最も本質的なものはどれか。",["色","キャリアの種類","大きさ","重さ"],1,"N形とP形の違いは電気伝導をする<b>キャリアの種類</b>（電子かホールか）にある。"],
]);
add("接合ダイオード", [
["1つの結晶の中でP形とN形が接して存在する構造を何というか。",["PN接合","LC共振","NPN接合","MOS構造"],0,"P形とN形が隣接して存在するものを<b>PN接合</b>と呼ぶ。"],
["PN接合でP形に(+)・N形に(−)を加える加え方を何というか。",["逆方向電圧","順方向電圧","降伏電圧","バイアス電圧"],1,"この向きでは電流が流れる。<b>順方向電圧</b>という。"],
["PN接合でP形に(−)・N形に(+)を加える加え方を何というか。",["順方向電圧","逆方向電圧","降伏電圧","接地電圧"],1,"この向きでは電流がほとんど流れない。<b>逆方向電圧</b>という。"],
["順方向電圧を加えたとき、PN接合ではどうなるか。",["電流が流れる","電流が流れない","破壊する","発光しない"],0,"順方向ではキャリアが接合面を越えて<b>電流が流れる</b>。"],
["逆方向電圧を加えたとき、通常のダイオードはどうなるか。",["大電流が流れる","ほとんど電流が流れない","発振する","増幅する"],1,"逆方向ではキャリアが電極側に引き寄せられ、<b>ほとんど電流が流れない</b>。"],
["ダイオードの主な働きはどれか。",["増幅作用","発振作用","整流作用","変調作用"],2,"順方向に通し逆方向に通さないので<b>整流作用</b>・スイッチング作用を行う。"],
["ダイオードが逆方向にはほとんど電流を流さない性質を利用した別名はどれか。",["スイッチングダイオード","増幅ダイオード","発振ダイオード","変換ダイオード"],0,"整流・スイッチング作用から<b>スイッチングダイオード</b>とも呼ばれる。"],
["平均電流100〜200mA以上の大容量ダイオードの別名はどれか。",["検波ダイオード","整流素子(パワーダイオード)","発光ダイオード","可変容量ダイオード"],1,"大容量のものは<b>整流素子(パワーダイオード)</b>と呼ばれ電力整流に用いる。"],
["小容量ダイオードが適している用途はどれか。",["電力整流","検波用","大電流開閉","高電圧絶縁"],1,"小容量のものは<b>検波用</b>に適している。"],
["順方向の立ち上がり電圧が大きいのはどちらか。",["Ge","Si","同じ","材料に無関係"],1,"立ち上がり電圧はGeより<b>Si</b>が大きい（Si約0.6V、Ge約0.2V）。"],
["ゲルマニウムダイオードの最高許容温度は約何℃か。",["約80℃","約150℃","約300℃","約500℃"],0,"Geは<b>約80℃</b>。Siは約150℃程度。"],
["シリコンダイオードの最高許容温度は約何℃か。",["約80℃","約150℃","約300℃","約600℃"],1,"Siは<b>約150℃</b>程度で、Geより耐熱性に優れる。"],
["接合ダイオードを製造技術で大別すると合金形と何形か。",["拡散形","蒸着形","巻線形","積層形"],0,"接合ダイオードは製造技術上、主に合金形と<b>拡散形</b>に区別される。"],
["合金形シリコンダイオードでN形シリコンに合金する金属はどれか。",["銅","アルミニウム","金","鉛"],1,"N形シリコンに<b>アルミニウム</b>を高温で合金し合金部をP形とする。"],
["合金形ダイオードで陽極(アノード)になるのはどちらか。",["Si側","Al側","両方","どちらでもない"],1,"Siが陰極、<b>Alが陽極</b>となる。"],
["逆方向電圧を大きくすると急に電流が増える現象を何というか。",["整流","降伏(ツェナー降伏)","変調","飽和"],1,"急激に電流が増える現象を<b>降伏(ツェナー降伏)</b>と呼ぶ。"],
["降伏を利用して電圧を一定に保つダイオードはどれか。",["エサキダイオード","定電圧ダイオード","可変容量ダイオード","発光ダイオード"],1,"降伏領域で電圧が一定になる特性を利用したのが<b>定電圧ダイオード</b>。"],
["定電圧ダイオードの別名はどれか。",["ツェナーダイオード","ショットキダイオード","バリキャップ","フォトダイオード"],0,"定電圧ダイオードは<b>ツェナーダイオード</b>とも呼ばれる。"],
["定電圧ダイオードの主な用途はどれか。",["発振回路","定電圧回路","変調回路","増幅回路"],1,"広い電流範囲で電圧が一定になるので<b>定電圧回路</b>に用いる。"],
["定電圧ダイオードで得られる降伏電圧のおおよその範囲はどれか。",["0.1〜1V","3〜1000V","1万V以上","マイナス値のみ"],1,"不純物量や合金温度を変え、降伏電圧を<b>3〜1000V</b>程度まで得られる。"],
["負性抵抗（電圧を上げると電流が減る）を示すダイオードはどれか。",["エサキダイオード","定電圧ダイオード","整流ダイオード","LED"],0,"<b>エサキダイオード</b>はトンネル効果で負性抵抗を示す。"],
["エサキダイオードは何の接合で作られるか。",["高純度N形Geと3価インジウム","純粋なSiのみ","金属と金属","絶縁体同士"],0,"不純物濃度の高い<b>N形ゲルマニウムと3価インジウム</b>の接合で作る。"],
["エサキダイオードで不純物が多いほど降伏電圧はどうなるか。",["大きくなる","小さくなる","変化しない","無限大"],1,"不純物が多いほど降伏電圧は<b>小さく</b>なる。"],
["エサキダイオードの主な用途はどれか。",["電力整流","超高周波の発振・増幅","照明","太陽光発電"],1,"低雑音・小形・高速なので<b>超高周波の発振・増幅</b>や電算機に用いる。"],
["エサキダイオードで負性抵抗の原因となる現象はどれか。",["トンネル効果","光電効果","熱電効果","圧電効果"],0,"逆方向で生じた<b>トンネル効果</b>と同様の現象が順方向でも起こる。"],
["逆方向電圧で静電容量が変化するダイオードはどれか。",["定電圧ダイオード","可変容量ダイオード","エサキダイオード","整流ダイオード"],1,"<b>可変容量ダイオード</b>は逆電圧で空乏層が変化し容量が変わる。"],

/*__QUESTIONS__*/

/* ===== ロジック ===== */
const $ = id => document.getElementById(id);
const KEYS = ["A","B","C","D"];
let pool=[], idx=0, correct=0, currentCat="", answered=false, wrongLog=[];

const cats = {};
QUESTIONS.forEach(q => cats[q.cat] = (cats[q.cat]||0)+1);
$("totalBadge").textContent = `全 ${QUESTIONS.length} 問 ／ ${Object.keys(cats).length} 分野`;

function buildCatList(){
  const c = $("catList"); c.innerHTML="";
  const all = document.createElement("button");
  all.className="cat all";
  all.innerHTML=`🎯 全分野からランダム出題（${QUESTIONS.length}問）`;
  all.onclick=()=>startQuiz("all");
  c.appendChild(all);
  Object.keys(cats).forEach(name=>{
    const b=document.createElement("button");
    b.className="cat";
    b.innerHTML=`<span>${name}</span><span class="n">${cats[name]}問</span>`;
    b.onclick=()=>startQuiz(name);
    c.appendChild(b);
  });
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getCount(){ return parseInt(document.querySelector('input[name="qcount"]:checked').value,10); }

function startQuiz(cat){
  currentCat=cat;
  let src = cat==="all" ? QUESTIONS : QUESTIONS.filter(q=>q.cat===cat);
  src = shuffle(src);
  const n=getCount();
  pool = (n>0 && n<src.length) ? src.slice(0,n) : src;
  idx=0; correct=0; wrongLog=[];
  show("quiz");
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  const q=pool[idx];
  $("progressText").textContent=`第 ${idx+1} 問 / 全 ${pool.length} 問`;
  $("catTag").textContent=q.cat;
  $("progBar").style.width=`${(idx)/pool.length*100}%`;
  $("qText").textContent=q.q;
  $("nextBtn").disabled=true;
  $("nextBtn").textContent = (idx===pool.length-1) ? "結果を見る →" : "次へ →";
  const box=$("explainBox"); box.className="explain"; box.innerHTML="";
  const order=shuffle(q.opts.map((t,i)=>({t,i})));
  const ul=$("optList"); ul.innerHTML="";
  order.forEach((o,pos)=>{
    const li=document.createElement("li");
    li.className="opt";
    li.innerHTML=`<span class="k">${KEYS[pos]}</span><span>${o.t}</span>`;
    li.onclick=()=>choose(li,o.i,q);
    ul.appendChild(li);
  });
}

function choose(el,chosen,q){
  if(answered) return;
  answered=true;
  const items=[...document.querySelectorAll(".opt")];
  items.forEach(li=>li.classList.add("disabled"));
  const isRight = chosen===q.a;
  if(isRight){ el.classList.add("correct"); correct++; }
  else{
    el.classList.add("wrong");
    items.forEach(li=>{ if(li.textContent.slice(1).trim()===q.opts[q.a]) li.classList.add("correct"); });
    wrongLog.push({q:q.q, right:q.opts[q.a]});
  }
  const box=$("explainBox");
  box.className="explain show";
  box.innerHTML=`${isRight?"✅ <b>正解！</b>":"❌ <b>不正解</b> 　正解："+q.opts[q.a]}<br>${q.ex}`;
  $("nextBtn").disabled=false;
}

$("nextBtn").onclick=()=>{
  if(idx<pool.length-1){ idx++; renderQuestion(); }
  else showResult();
};
$("quitBtn").onclick=()=>{ if(confirm("クイズをやめて分野選択に戻りますか？")) show("start"); };
$("retryBtn").onclick=()=>startQuiz(currentCat);
$("homeBtn").onclick=()=>show("start");

function showResult(){
  show("result");
  const pct=Math.round(correct/pool.length*100);
  $("scoreText").textContent=`${correct} / ${pool.length}`;
  $("scoreBar").style.width=`${pct}%`;
  let grade;
  if(pct===100) grade="🏆 満点！完璧です";
  else if(pct>=80) grade="🎉 合格ライン！よくできました";
  else if(pct>=60) grade="👍 あと一歩、復習しよう";
  else grade="📘 もう一度テキストを確認しよう";
  $("gradeText").textContent=`正答率 ${pct}%　${grade}`;
  const rv=$("reviewList");
  if(wrongLog.length===0){ rv.innerHTML=`<div style="color:var(--muted)">間違えた問題はありません。素晴らしい！</div>`; }
  else{
    rv.innerHTML=`<div style="color:var(--muted);margin-bottom:8px">📝 間違えた問題（${wrongLog.length}問）</div>`+
      wrongLog.map(w=>`<div style="padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:.9rem">Q. ${w.q}<br><span style="color:var(--ok)">正解：${w.right}</span></div>`).join("");
  }
}

function show(screen){
  $("startScreen").classList.toggle("hidden", screen!=="start");
  $("quizScreen").classList.toggle("hidden", screen!=="quiz");
  $("resultScreen").classList.toggle("hidden", screen!=="result");
  window.scrollTo({top:0,behavior:"smooth"});
}

buildCatList();
</script>
