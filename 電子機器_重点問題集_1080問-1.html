,"動作速度が速く消費電力が大きい","アナログ信号の線形増幅に適する"],"answer":0,"answerText":"消費電力が非常に小さく高集積化しやすい","explanation":"電流注入形論理で、微小電力・小面積に向く。","priority":true,"diagram":null},{"id":"Q0728","concept":64,"type":"tf","section":"コイル","page":79,"text":"「次の設問「コイルが電流変化に対して生じる作用はどれか。」に対する答えは「自己誘導による逆起電力」である。」","answer":true,"answerText":"○","explanation":"電流変化を妨げる向きに誘導起電力を生じる。","priority":true,"diagram":null},{"id":"Q0551","concept":111,"type":"choice","section":"電源回路","page":113,"text":"電圧変動率が小さい電源の特徴はどれか。","choices":["負荷変動による出力電圧変化が小さい","入力電力に対する損失電力の割合が小さい","出力直流分に対するリップル成分が小さい","負荷電流の増加に伴う出力電圧低下が大きい"],"answer":0,"answerText":"負荷変動による出力電圧変化が小さい","explanation":"安定化された電源ほど小さい。","priority":true,"diagram":null},{"id":"Q0224","concept":45,"type":"choice","section":"抵抗器材料","page":72,"text":"次のうち最も適切なものを選べ。 巻線抵抗器の長所はどれか。","choices":["同一基板上へ高密度に形成しやすい","電流容量が大きく機械的に強い","抵抗値を微細な寸法で高くしやすい","高周波でのインダクタンス成分が小さい"],"answer":1,"answerText":"電流容量が大きく機械的に強い","explanation":"抵抗線を巻くため大電力用途に向くが高周波には不向き。","priority":true,"diagram":null},{"id":"Q0264","concept":53,"type":"choice","section":"コンデンサ材料","page":75,"text":"次のうち最も適切なものを選べ。 タンタル電解コンデンサの特徴はどれか。","choices":["アルミ電解より小形で周波数特性がよい","アルミ電解より大形で高耐圧に向く","アルミ電解より容量変化が大きく低周波に向く","アルミ電解より安価で逆接続に強い"],"answer":0,"answerText":"アルミ電解より小形で周波数特性がよい","explanation":"極性をもつため逆接続に注意する。","priority":true,"diagram":null},{"id":"Q0615","concept":8,"type":"tf","section":"PN接合","page":55,"text":"「次の設問「PN接合に逆方向電圧を加えたときの基本動作はどれか。」に対する答えは「ごく小さな電流を除き電流を流さない」である。」","answer":true,"answerText":"○","explanation":"逆方向では空乏層が広がり、通常はほとんど電流が流れない。","priority":true,"diagram":"pn"}];const KEY='electronics-quiz-1080-62054cf290f4065d';let state=JSON.parse(localStorage.getItem(KEY)||'{}'),filter='all',order=QUESTIONS.map(q=>q.id);const byId=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s||'').normalize('NFKC').replace(/[\s・（）()、。]/g,'').toLowerCase();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function answer(q,st){return `<div class="result ${st.correct?'ok':'ng'}"><b>${st.correct?'正解。':'正解：'+esc(q.answerText)}</b><div class="explain">${esc(q.explanation)}</div><div class="source">本文 p.${q.page}</div></div>`}function grade(id,reveal=false){const q=byId[id],s=state[id]||{};let ok=false;if(!reveal){if(q.type==='choice')ok=Number(s.value)===q.answer;else if(q.type==='tf')ok=String(s.value)===String(q.answer);else ok=(q.aliases||[]).some(a=>norm(a)===norm(s.value));}state[id]={...s,checked:true,correct:ok,revealed:reveal};save();render()}function render(){const root=document.getElementById('quiz');root.innerHTML='';const sec=document.getElementById('section').value,typ=document.getElementById('type').value;let last='';for(const id of order){const q=byId[id],s=state[id]||{};let show=filter==='all'||filter==='priority'&&q.priority||filter==='wrong'&&s.checked&&!s.correct||filter==='unanswered'&&!s.checked;if(sec!=='all'&&q.section!==sec)show=false;if(typ!=='all'&&q.type!==typ)show=false;if(!show)continue;if(q.section!==last){const h=document.createElement('h2');h.className='section-title';h.textContent=q.section;root.appendChild(h);last=q.section}const c=document.createElement('article');c.className='card'+(s.checked?(s.correct?' correct':' wrong'):'');let body='';if(q.type==='choice')body='<div class="choices">'+q.choices.map((x,i)=>`<button class="choice ${String(s.value)===String(i)?'selected':''}" data-pick="${i}">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('')+'</div>';else if(q.type==='tf')body=`<div class="choices"><button class="choice ${String(s.value)==='true'?'selected':''}" data-pick="true">○ 正しい</button><button class="choice ${String(s.value)==='false'?'selected':''}" data-pick="false">× 誤り</button></div>`;else body=`<input class="short" value="${esc(s.value||'')}" placeholder="用語または要点を入力">`;c.dataset.id=id;c.innerHTML=`<div class="meta"><span>${id}</span><span class="badge">${q.type==='choice'?'4択':q.type==='tf'?'○×':'記述'}</span>${q.priority?'<span class="badge priority">重点</span>':''}<span>本文 p.${q.page}</span></div><div class="question">${esc(q.text)}</div>${diagramSVG(q.diagram)}${body}<div class="actions"><button class="check primary">判定</button><button class="reveal">答えを見る</button></div>${s.checked?answer(q,s)+(q.type==='short'?'<div class="actions"><span>意味が同じか確認して自己採点：</span><button data-selfgrade="yes">正解にする</button><button data-selfgrade="no">不正解にする</button></div>':''):''}`;root.appendChild(c)}update()}function update(){let a=0,ok=0;QUESTIONS.forEach(q=>{const s=state[q.id];if(s?.checked){a++;if(s.correct)ok++}});score.textContent=`${ok} / ${QUESTIONS.length} 正解`;answered.textContent=`${a}問回答`;bar.style.width=`${a/QUESTIONS.length*100}%`}document.addEventListener('click',e=>{const c=e.target.closest('.card');if(e.target.dataset.pick!==undefined&&c){state[c.dataset.id]={...(state[c.dataset.id]||{}),value:e.target.dataset.pick};save();render()}if(e.target.classList.contains('check')&&c){const q=byId[c.dataset.id];if(q.type==='short'){state[q.id]={...(state[q.id]||{}),value:c.querySelector('.short').value}}grade(c.dataset.id)}if(e.target.classList.contains('reveal')&&c)grade(c.dataset.id,true);if(e.target.dataset.filter){filter=e.target.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===e.target));render()}});[section,type].forEach(x=>x.onchange=render);[...new Set(QUESTIONS.map(q=>q.section))].forEach(x=>section.add(new Option(x,x)));shuffle.onclick=()=>{for(let i=order.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}render();scrollTo({top:0,behavior:'smooth'})};restore.onclick=()=>{order=QUESTIONS.map(q=>q.id);render()};reset.onclick=()=>{if(confirm('すべての解答履歴を消しますか？')){state={};localStorage.removeItem(KEY);render()}};const counts={};QUESTIONS.forEach(q=>counts[q.section]=(counts[q.section]||0)+1);coverage.innerHTML=Object.entries(counts).map(([k,v])=>`<div>✓ ${esc(k)}：${v}問</div>`).join('');render();
