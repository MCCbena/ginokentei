iority{background:#fff3bf;color:#7c4d00}.question{font-weight:700;font-size:1.03rem;margin:7px 0 10px}.choices{display:grid;gap:7px}.choice{display:flex;gap:8px;text-align:left;align-items:flex-start}.choice.selected{border-color:var(--blue);background:#eaf2ff}.short{width:min(100%,620px);padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px}.actions{display:flex;gap:8px;margin-top:11px}.result{margin-top:11px;padding:11px 13px;border-radius:10px}.result.ok{background:#e6fcf5;color:#066649}.result.ng{background:#fff0f0;color:#8f1111}.explain{color:var(--ink);margin-top:6px}.source{font-size:.82rem;color:var(--muted);margin-top:6px}.coverage{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;font-size:.88rem}@media(max-width:720px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}main{padding:10px}}@media print{.toolbar,.actions,.notice{display:none}.result{display:block}.card{break-inside:avoid;box-shadow:none}}
</style></head><body><header><div class="wrap"><h1>電子機器｜重点問題集 220問</h1><p class="lead">PDF p.54～163の収録範囲を、材料・部品特性を厚めにして反復できる総合問題集。</p><div class="summary"><div class="stat"><b>220</b>全問題</div><div class="stat"><b>120</b>4択</div><div class="stat"><b>50</b>○×</div><div class="stat"><b>50</b>記述</div></div></div></header><div class="toolbar"><div class="wrap controls"><button data-filter="all" class="active">全問題</button><button data-filter="priority">重点のみ</button><button data-filter="wrong">誤答のみ</button><button data-filter="unanswered">未回答</button><select id="type"><option value="all">全形式</option><option value="choice">4択</option><option value="tf">○×</option><option value="short">記述</option></select><select id="section"><option value="all">全分野</option></select><button id="shuffle">シャッフル</button><button id="restore">元の順番</button><button id="reset">リセット</button><button onclick="window.print()">印刷</button></div><div class="wrap progressbox"><span id="score">0 / 220 正解</span><div class="bar"><i id="bar"></i></div><span id="answered">0問回答</span></div></div><main class="wrap"><div class="notice"><b>配分：</b>4択を最多（120問）、○×と記述を同数（各50問）。PDFの線引き箇所は「重点」候補として反映しつつ、章全体の重要事項も補完しています。記述は表記揺れで自動判定が難しいため、判定後の模範解答・解説も確認してください。</div><div id="quiz"></div><div class="coverage"><details><summary><b>出題範囲・件数</b></summary><div class="grid" id="coverage"></div></details></div></main><script>
const QUESTIONS=[{"id":"Q001","type":"choice","section":"半導体の性質","page":54,"text":"N形半導体で多数キャリアとなるものは何か。","choices":["中性子","電子","正孔","陽イオン"],"answer":1,"answerText":"電子","explanation":"N形では電子が多数キャリア、正孔が少数キャリア。","priority":true},{"id":"Q002","type":"choice","section":"半導体の性質","page":54,"text":"P形半導体で多数キャリアとなるものは何か。","choices":["陰イオン","自由原子","正孔（ホール）","電子"],"answer":2,"answerText":"正孔（ホール）","explanation":"P形では正孔が多数キャリア、電子が少数キャリア。","priority":true},{"id":"Q003","type":"choice","section":"半導体の性質","page":54,"text":"真性半導体に微量の不純物を加える主目的は何か。","choices":["絶縁体にするため","融点を下げるため","機械強度だけを上げるため","キャリア数を制御して所望の抵抗率を得るため"],"answer":3,"answerText":"キャリア数を制御して所望の抵抗率を得るため","explanation":"不純物濃度により伝導電子または正孔の量を制御できる。","priority":true},{"id":"Q004","type":"choice","section":"半導体の性質","page":54,"text":"N形半導体を作るためSiに加える代表的な不純物はどれか。","choices":["リンなどの5価元素","ホウ素などの3価元素","銅などの1価元素","酸素だけ"],"answer":0,"answerText":"リンなどの5価元素","explanation":"5価元素は余分な電子を供給するドナーとなる。","priority":true},{"id":"Q005","type":"choice","section":"半導体の性質","page":54,"text":"P形半導体を作るためSiに加える代表的な不純物はどれか。","choices":["鉄だけ","ホウ素などの3価元素","リンなどの5価元素","ネオンなどの希ガス"],"answer":1,"answerText":"ホウ素などの3価元素","explanation":"3価元素は正孔を生じさせるアクセプタとなる。","priority":true},{"id":"Q006","type":"choice","section":"半導体の性質","page":54,"text":"共有結合から電子が抜けた空席を何と呼ぶか。","choices":["コレクタ","障壁電位","正孔（ホール）","ドナー"],"answer":2,"answerText":"正孔（ホール）","explanation":"正孔は正電荷のように振る舞い、電界方向へ移動する。","priority":true},{"id":"Q007","type":"choice","section":"PN接合","page":55,"text":"PN接合に順方向電圧を加えたときの状態として正しいものはどれか。","choices":["障壁が高くなり電流が止まる","必ず降伏する","静電容量が必ずゼロになる","障壁が低くなり電流が流れる"],"answer":3,"answerText":"障壁が低くなり電流が流れる","explanation":"P側を正、N側を負にするとキャリアが接合面を越える。","priority":true},{"id":"Q008","type":"choice","section":"PN接合","page":55,"text":"PN接合に逆方向電圧を加えたときの基本動作はどれか。","choices":["ごく小さな電流を除き電流を流さない","順方向より大電流を流す","必ず発光する","抵抗が常に0になる"],"answer":0,"answerText":"ごく小さな電流を除き電流を流さない","explanation":"逆方向では空乏層が広がり、通常はほとんど電流が流れない。","priority":true},{"id":"Q009","type":"choice","section":"トランジスタ基礎","page":56,"text":"NPNトランジスタの3領域の並びはどれか。","choices":["P-P-N","N-P-N","P-N-P","N-N-P"],"answer":1,"answerText":"N-P-N","explanation":"中央の薄い領域がベース、両側がエミッタとコレクタ。","priority":true},{"id":"Q010","type":"choice","section":"トランジスタ基礎","page":56,"text":"バイポーラトランジスタの端子名の組合せはどれか。","choices":["ソース・ゲート・ドレイン","入力・接地・出力のみ","エミッタ・ベース・コレクタ","アノード・カソード・ゲート"],"answer":2,"answerText":"エミッタ・ベース・コレクタ","explanation":"端子はE、B、Cで表す。","priority":true},{"id":"Q011","type":"choice","section":"トランジスタ基礎","page":56,"text":"増幅回路で最も一般的で、入出力に共通となる端子がエミッタの接続は何か。","choices":["ベース接地回路","コレクタ接地回路","ゲート接地回路","エミッタ接地回路"],"answer":3,"answerText":"エミッタ接地回路","explanation":"エミッタ接地は電圧・電流・電力増幅が得られ、広く使われる。","priority":true},{"id":"Q012","type":"choice","section":"接合ダイオード","page":57,"text":"一般にSiダイオードがGeダイオードより優れる点はどれか。","choices":["逆方向耐圧と許容温度が高い","順方向立上り電圧が必ず低い","光を必ず発する","静電容量が必ず大きい"],"answer":0,"answerText":"逆方向耐圧と許容温度が高い","explanation":"SiはGeより耐圧・耐熱性に優れ、広く使われる。","priority":true},{"id":"Q013","type":"choice","section":"接合ダイオード","page":57,"text":"大容量の接合ダイオードを電力整流に用いるときの名称は何か。","choices":["サーミスタ","電力用ダイオード（整流器）","可変容量ダイオード","フォトカプラ"],"answer":1,"answerText":"電力用ダイオード（整流器）","explanation":"大電流を扱うものは電力整流器に使われる。","priority":false},{"id":"Q014","type":"choice","section":"特殊ダイオード","page":58,"text":"ツェナー降伏を利用するダイオードはどれか。","choices":["フォトダイオード","可変抵抗器","定電圧ダイオード","発光ダイオード"],"answer":2,"answerText":"定電圧ダイオード","explanation":"逆方向電圧を一定に保つ性質を定電圧回路に利用する。","priority":true},{"id":"Q015","type":"choice","section":"特殊ダイオード","page":58,"text":"エサキダイオードの特徴として正しいものはどれか。","choices":["光を受けて発電する","温度だけで抵抗が変化する","電流を完全に遮断する","負性抵抗特性を示す"],"answer":3,"answerText":"負性抵抗特性を示す","explanation":"トンネル効果による負性抵抗領域をもち、高周波発振などに使う。","priority":true},{"id":"Q016","type":"choice","section":"特殊ダイオード","page":59,"text":"可変容量ダイオードで容量を変えるために用いるものは何か。","choices":["逆方向バイアス電圧","順方向大電流","光の強度だけ","機械的な回転軸"],"answer":0,"answerText":"逆方向バイアス電圧","explanation":"空乏層幅が逆電圧で変わり、接合容量が変化する。","priority":true},{"id":"Q017","type":"choice","section":"特殊ダイオード","page":59,"text":"可変容量ダイオードの代表的用途はどれか。","choices":["機械式リレー駆動のみ","電子同調・FM変調","大電力整流のみ","温度検出のみ"],"answer":1,"answerText":"電子同調・FM変調","explanation":"高周波回路で電圧制御容量として使われる。","priority":true},{"id":"Q018","type":"choice","section":"FET","page":61,"text":"接合形FETで電流を制御する端子はどれか。","choices":["エミッタ","アノード","ゲート","ベース"],"answer":2,"answerText":"ゲート","explanation":"ゲート電圧でチャネル幅を変え、ドレイン電流を制御する。","priority":true},{"id":"Q019","type":"choice","section":"FET","page":61,"text":"FETがバイポーラトランジスタと異なる代表的な呼び方はどれか。","choices":["電流制御素子だけ","熱制御素子","光制御素子だけ","電圧制御素子"],"answer":3,"answerText":"電圧制御素子","explanation":"ゲート電圧によって出力電流を制御する。","priority":true},{"id":"Q020","type":"choice","section":"FET","page":61,"text":"接合形FETのゲートにほとんど電流が流れないため得られる特徴は何か。","choices":["入力インピーダンスが高い","出力抵抗が必ず0","動作周波数が0","電力損失が必ず最大"],"answer":0,"answerText":"入力インピーダンスが高い","explanation":"ゲート接合を逆バイアスして用いる。","priority":true},{"id":"Q021","type":"choice","section":"パワー半導体","page":63,"text":"パワーMOSFETが特に用いられる領域として適切なのはどれか。","choices":["液晶偏光板だけ","高速スイッチング電源やDC-DCコンバータ","低周波の機械接点だけ","光検出だけ"],"answer":1,"answerText":"高速スイッチング電源やDC-DCコンバータ","explanation":"高速・低損失の電力スイッチに向く。","priority":true},{"id":"Q022","type":"choice","section":"パワー半導体","page":63,"text":"IGBTはどの組合せの素子か。","choices":["抵抗とコンデンサ","コイルとリレー","MOSゲートとバイポーラトランジスタ","LEDとフォトダイオード"],"answer":2,"answerText":"MOSゲートとバイポーラトランジスタ","explanation":"絶縁ゲートバイポーラトランジスタで、電力制御に使う。","priority":true},{"id":"Q023","type":"choice","section":"集積回路","page":64,"text":"ICの利点として不適切なものはどれか。","choices":["小形化できる","大量生産で安価になる","信頼性を高くできる","個別部品より修理交換が容易である"],"answer":3,"answerText":"個別部品より修理交換が容易である","explanation":"IC内部は個々の部品単位で交換しにくい。","priority":true},{"id":"Q024","type":"choice","section":"集積回路","page":65,"text":"1枚の半導体基板上に全素子を一体形成したICは何か。","choices":["モノリシックIC","ハイブリッドIC","リードリレー","集合抵抗"],"answer":0,"answerText":"モノリシックIC","explanation":"同一シリコン結晶基板に素子を作り込む。","priority":true},{"id":"Q025","type":"choice","section":"集積回路","page":65,"text":"絶縁基板上に膜部品と個別半導体などを組み合わせたICは何か。","choices":["水銀リレー","ハイブリッドIC","モノリシックIC","CMOSだけ"],"answer":1,"answerText":"ハイブリッドIC","explanation":"異種材料・素子を組み合わせやすい。","priority":true},{"id":"Q026","type":"choice","section":"集積回路","page":65,"text":"ハイブリッドICの利点として適切なのはどれか。","choices":["個別部品を一切使えない","製造工程が常に最少","高電圧・大出力や異種素子の組合せに対応しやすい","集積度が必ず最大"],"answer":2,"answerText":"高電圧・大出力や異種素子の組合せに対応しやすい","explanation":"抵抗・コンデンサ・半導体などを目的に応じて組み合わせる。","priority":true},{"id":"Q027","type":"choice","section":"論理IC","page":67,"text":"ショットキーTTLでSBDを付加する主目的は何か。","choices":["消費電力を必ず0にする","光を発生させる","入力抵抗を無限大にする","トランジスタの飽和を防ぎ高速化する"],"answer":3,"answerText":"トランジスタの飽和を防ぎ高速化する","explanation":"蓄積時間を減らし、切替えを速くする。","priority":true},{"id":"Q028","type":"choice","section":"論理IC","page":67,"text":"ECLの特徴として正しいものはどれか。","choices":["動作速度が非常に速いが消費電力が大きい","最も遅く消費電力も大きい","機械接点で動く","電源を必要としない"],"answer":0,"answerText":"動作速度が非常に速いが消費電力が大きい","explanation":"非飽和動作を利用して高速だが、電力を多く消費する。","priority":true},{"id":"Q029","type":"choice","section":"論理IC","page":67,"text":"IILの特徴として適切なのはどれか。","choices":["常にアナログ専用","消費電力が非常に小さく高集積化しやすい","高電圧大出力専用","機械式である"],"answer":1,"answerText":"消費電力が非常に小さく高集積化しやすい","explanation":"電流注入形論理で、微小電力・小面積に向く。","priority":true},{"id":"Q030","type":"choice","section":"MOS IC","page":67,"text":"MOS ICの長所として適切なのはどれか。","choices":["静電気に極めて強い","アナログ以外に使えない","集積密度が高く消費電力が小さい","動作速度が必ずECLより速い"],"answer":2,"answerText":"集積密度が高く消費電力が小さい","explanation":"製造プロセスが簡単で高集積化しやすい。","priority":true},{"id":"Q031","type":"choice","section":"MOS IC","page":67,"text":"NチャネルMOSがPチャネルMOSより高速になりやすい主因は何か。","choices":["正孔が電子より軽い","ゲートが存在しない","酸化膜が不要だから","電子の移動度が正孔より大きい"],"answer":3,"answerText":"電子の移動度が正孔より大きい","explanation":"電子キャリアの移動度が高い。","priority":true},{"id":"Q032","type":"choice","section":"MOS IC","page":68,"text":"CMOSの基本構成はどれか。","choices":["PチャネルMOSとNチャネルMOSの相補接続","NPNとPNPの直列だけ","抵抗とコイルだけ","LEDと受光素子だけ"],"answer":0,"answerText":"PチャネルMOSとNチャネルMOSの相補接続","explanation":"相補形MOSで、一方がオンのとき他方がオフになる。","priority":true},{"id":"Q033","type":"choice","section":"MOS IC","page":68,"text":"CM xt":"αとβの関係として正しいものはどれか。","choices":["β=α/(1-α)","β=1-α","β=1/α","β=α+1"],"answer":0,"answerText":"β=α/(1-α)","explanation":"IE=IB+ICから導かれる。","priority":true},{"id":"Q085","type":"choice","section":"トランジスタ増幅","page":93,"text":"エミッタ接地回路の入出力位相関係はどれか。","choices":["位相関係なし","逆相","同相","90度進みのみ"],"answer":1,"answerText":"逆相","explanation":"入力増加でコレクタ電圧は低下するため180°反転する。","priority":true},{"id":"Q086","type":"choice","section":"トランジスタ増幅","page":94,"text":"バイアス電圧を与える主目的は何か。","choices":["電源を不要にするため","入力抵抗を0にするため","入力信号の全周期をひずみなく増幅するため","発振を必ず止めるため"],"answer":2,"answerText":"入力信号の全周期をひずみなく増幅するため","explanation":"動作点を適切な位置に設定する。","priority":true},{"id":"Q087","type":"choice","section":"トランジスタ増幅","page":95,"text":"A級増幅の特徴はどれか。","choices":["半周期だけ動作","無信号時電流が0","クロスオーバひずみが必ず大きい","全周期で動作しひずみが少ないが効率が低い"],"answer":3,"answerText":"全周期で動作しひずみが少ないが効率が低い","explanation":"直線性重視の増幅に向く。","priority":true},{"id":"Q088","type":"choice","section":"トランジスタ増幅","page":95,"text":"B級プッシュプル増幅の特徴はどれか。","choices":["各素子が半周期ずつ動作し効率が高い","各素子が全周期動作","出力が必ず0","電源が不要"],"answer":0,"answerText":"各素子が半周期ずつ動作し効率が高い","explanation":"ゼロ付近にクロスオーバひずみが生じうる。","priority":true},{"id":"Q089","type":"choice","section":"トランジスタ増幅","page":96,"text":"シリコントランジスタのVBEの温度変化として本文に近いものはどれか。","choices":["必ず0Vになる","温度1℃上昇で約2～2.5mV低下","温度1℃上昇で1V上昇","温度と無関係"],"answer":1,"answerText":"温度1℃上昇で約2～2.5mV低下","explanation":"温度上昇で動作点が変化するため安定化が必要。","priority":true},{"id":"Q090","type":"choice","section":"バイアス回路","page":97,"text":"固定バイアス回路の欠点はどれか。","choices":["増幅できない","電源が2つ必須","hFEや温度変化の影響を受けやすい","回路が複雑すぎる"],"answer":2,"answerText":"hFEや温度変化の影響を受けやすい","explanation":"簡単だが安定度が低い。","priority":true},{"id":"Q091","type":"choice","section":"バイアス回路","page":97,"text":"電流帰還バイアスが安定しやすい理由は何か。","choices":["正帰還で発振するため","光帰還を使うため","コイルで整流するため","エミッタ抵抗による負帰還が働くため"],"answer":3,"answerText":"エミッタ抵抗による負帰還が働くため","explanation":"IC増加時にVEが上がりVBEを抑える。","priority":true},{"id":"Q092","type":"choice","section":"増幅回路","page":98,"text":"CR結合増幅回路が主に増幅する信号はどれか。","choices":["低周波の交流信号","直流だけ","光信号だけ","機械変位だけ"],"answer":0,"answerText":"低周波の交流信号","explanation":"結合コンデンサで直流を遮断して段間結合する。","priority":true},{"id":"Q093","type":"choice","section":"増幅回路","page":99,"text":"B級プッシュプル回路の代表的長所はどれか。","choices":["無限の利得","電力効率が高い","クロスオーバひずみがない","トランジスタ1個だけでよい"],"answer":1,"answerText":"電力効率が高い","explanation":"2個が交互に半周期を受け持つ。","priority":true},{"id":"Q094","type":"choice","section":"高周波回路","page":100,"text":"高周波増幅回路で同調回路を用いる目的は何か。","choices":["全周波数を同じにする","電源を不要にする","必要な周波数成分だけを選択増幅する","直流成分だけを増幅"],"answer":2,"answerText":"必要な周波数成分だけを選択増幅する","explanation":"LC共振回路の選択性を使う。","priority":true},{"id":"Q095","type":"choice","section":"高周波回路","page":100,"text":"同調回路のQが高いとどうなるか。","choices":["帯域が必ず広くなる","共振しなくなる","直流利得が0になる","選択度が高くなる"],"answer":3,"answerText":"選択度が高くなる","explanation":"Q=f0/(f2-f1)で、Qが高いほど帯域が狭い。","priority":true},{"id":"Q096","type":"choice","section":"差動増幅","page":100,"text":"差動増幅回路が増幅するものはどれか。","choices":["2入力の差","2入力の和だけ","電源電圧だけ","温度だけ"],"answer":0,"answerText":"2入力の差","explanation":"同相成分を抑え、差電圧を増幅する。","priority":true},{"id":"Q097","type":"choice","section":"オペアンプ","page":102,"text":"理想オペアンプの入力インピーダンスはどう考えるか。","choices":["周波数に無関係に1kΩ","無限大","0","1Ω固定"],"answer":1,"answerText":"無限大","explanation":"入力電流を0とみなす。","priority":true},{"id":"Q098","type":"choice","section":"オペアンプ","page":102,"text":"負帰還をかけた理想オペアンプで成り立つ仮想短絡はどれか。","choices":["出力電流が0","電源電圧が不要","V+=V-とみなせる","V+=0が常に成立"],"answer":2,"answerText":"V+=V-とみなせる","explanation":"入力端子間電圧はほぼ0だが、端子は実際には短絡されていない。","priority":true},{"id":"Q099","type":"choice","section":"オペアンプ","page":103,"text":"反転増幅回路の電圧増幅度はどれか。","choices":["A=1+R2/R1","A=R1/R2","A=0","A=-R2/R1"],"answer":3,"answerText":"A=-R2/R1","explanation":"負号は位相反転を表す。","priority":true},{"id":"Q100","type":"choice","section":"オペアンプ","page":103,"text":"非反転増幅回路の電圧増幅度はどれか。","choices":["A=1+R2/R1","A=-R2/R1","A=R1-R2","A=-1だけ"],"answer":0,"answerText":"A=1+R2/R1","explanation":"入力と出力は同相。","priority":true},{"id":"Q101","type":"choice","section":"発振回路","page":104,"text":"発振を持続する基本条件として正しいものはどれか。","choices":["電源が不要","ループ利得が1以上で帰還位相が正帰還条件を満たす","必ず負帰還だけ","入力信号が常に必要"],"answer":1,"answerText":"ループ利得が1以上で帰還位相が正帰還条件を満たす","explanation":"増幅器出力の一部を同相で戻す。","priority":true},{"id":"Q102","type":"choice","section":"発振回路","page":105,"text":"LC発振回路が主に使われる周波数帯はどれか。","choices":["1Hz未満だけ","光周波数だけ","比較的高い周波数","直流だけ"],"answer":2,"answerText":"比較的高い周波数","explanation":"LC共振周波数で正弦波を得る。","priority":true},{"id":"Q103","type":"choice","section":"発振回路","page":105,"text":"CR発振回路の特徴はどれか。","choices":["必ずGHz専用","水晶より常に安定","コンデンサを使わない","コイルを使わず低周波を得やすい"],"answer":3,"answerText":"コイルを使わず低周波を得やすい","explanation":"RC位相シフトなどで発振する。","priority":true},{"id":"Q104","type":"choice","section":"発振回路","page":106,"text":"水晶発振回路が高安定な理由は何か。","choices":["水晶振動子のQが非常に高い","抵抗値が0だから","電源が不要だから","光を使うから"],"answer":0,"answerText":"水晶振動子のQが非常に高い","explanation":"共振周波数が鋭く、温度・電源変動の影響が小さい。","priority":true},{"id":"Q105","type":"choice","section":"変調","page":108,"text":"AMで変化させる搬送波の量はどれか。","choices":["直流抵抗","振幅","周波数","位相だけ"],"answer":1,"answerText":"振幅","explanation":"信号波に応じて搬送波振幅を変える。","priority":true},{"id":"Q106","type":"choice","section":"変調","page":109,"text":"FMで変化させる搬送波の量はどれか。","choices":["抵抗値","電源電圧だけ","周波数","振幅"],"answer":2,"answerText":"周波数","explanation":"信号波に応じて瞬時周波数を変える。","priority":true},{"id":"Q107","type":"choice","section":"変調","page":109,"text":"SSBの利点はどれか。","choices":["復調器が最も単純","上下両側波を必ず送る","搬送波電力を増やす","占有周波数帯域と送信電力を節約できる"],"answer":3,"answerText":"占有周波数帯域と送信電力を節約できる","explanation":"片側波帯だけを送る。","priority":true},{"id":"Q108","type":"choice","section":"復調","page":110,"text":"直線検波回路の主要素子はどれか。","choices":["ダイオード","可変抵抗器だけ","リレーだけ","水晶振動子だけ"],"answer":0,"answerText":"ダイオード","explanation":"整流と平滑によりAM包絡線を取り出す。","priority":true},{"id":"Q109","type":"choice","section":"復調","page":111,"text":"フォスタ・シーレー回路は何の復調に使うか。","choices":["デジタル加算","FM","AMだけ","直流"],"answer":1,"answerText":"FM","explanation":"周波数偏移を振幅差へ変換して検波する。","priority":true},{"id":"Q110","type":"choice","section":"電源回路","page":113,"text":"リップル百分率が小さいほど何を示すか。","choices":["整流効率が0","負荷変動が最大","直流出力が滑らかである","交流分が大きい"],"answer":2,"answerText":"直流出力が滑らかである","explanation":"直流中の交流成分が少ない。","priority":true},{"id":"Q111","type":"choice","section":"電源回路","page":113,"text":"電圧変動率が小さい電源の特徴はどれか。","choices":["無負荷電圧が必ず0","交流入力が不要","効率が必ず0","負荷変動による出力電圧変化が小さい"],"answer":3,"answerText":"負荷変動による出力電圧変化が小さい","explanation":"安定化された電源ほど小さい。","priority":true},{"id":"Q112","type":"choice","section":"整流回路","page":114,"text":"半波整流回路で用いる基本ダイオード数は何個か。","choices":["1個","2個","4個","6個"],"answer":0,"answerText":"1個","explanation":"交流の一方の半周期だけを利用する。","priority":true},{"id":"Q113","type":"choice","section":"整流回路","page":114,"text":"センタタップ式全波整流回路で用いるダイオード数は何個か。","choices":["8個","2個","1個","4個"],"answer":1,"answerText":"2個","explanation":"変圧器二次巻線の中点を利用する。","priority":true},{"id":"Q114","type":"choice","section":"整流回路","page":114,"text":"ブリッジ整流回路で用いるダイオード数は何個か。","choices":["2個","3個","4個","1個"],"answer":2,"answerText":"4個","explanation":"変圧器のセンタタップを不要にできる。","priority":true},{"id":"Q115","type":"choice","section":"整流回路","page":114,"text":"全波整流のリップル周波数は入力周波数の何倍か。","choices":["1/2倍","同じ","4倍","2倍"],"answer":3,"answerText":"2倍","explanation":"正負両半周期を同じ極性で利用する。","priority":true},{"id":"Q116","type":"choice","section":"製図・表示","page":152,"text":"電子機器の図記号を用いる主目的は何か。","choices":["接続関係を簡潔かつ共通に表すため","実物と同じ大きさで描くため","色だけで材料を示すため","文章を増やすため"],"answer":0,"answerText":"接続関係を簡潔かつ共通に表すため","explanation":"規格化された記号で回路を明確に表す。","priority":false},{"id":"Q117","type":"choice","section":"製図・表示","page":157,"text":"接続図で交差する線を接続しないことを明確にする方法はどれか。","choices":["抵抗記号に置換する","ジャンプまたは非接続表現を用いる","必ず黒丸を付ける","線を太くするだけ"],"answer":1,"answerText":"ジャンプまたは非接続表現を用いる","explanation":"接続点は黒丸などで明確にし、非接続と区別する。","priority":false},{"id":"Q118","type":"choice","section":"製図・表示","page":158,"text":"組立図に記入する内容として適切なのはどれか。","choices":["材料名を一切書かない","電源波形だけ","部品番号・位置・取付関係","計算式だけ"],"answer":2,"answerText":"部品番号・位置・取付関係","explanation":"組立・検査に必要な配置関係を示す。","priority":false},{"id":"Q119","type":"choice","section":"部品表示","page":162,"text":"抵抗のカラーコードで最初の2本（4帯式）が表すものは何か。","choices":["許容差だけ","温度係数だけ","単位だけ","有効数字"],"answer":3,"answerText":"有効数字","explanation":"第3帯が乗数、第4帯が許容差。","priority":true},{"id":"Q120","type":"choice","section":"部品表示","page":163,"text":"コンデンサの3桁数字表示で末尾の数字が表すものは何か。","choices":["pF単位で加える0の個数（乗数）","極性だけ","耐圧だけ","製造年だけ"],"answer":0,"answerText":"pF単位で加える0の個数（乗数）","explanation":"例：103は10×10^3 pF=0.01µF。","priority":true},{"id":"Q121","type":"tf","section":"半導体の性質","page":54,"text":"「N形半導体で多数キャリアとなるものは電子である。」","answer":true,"answerText":"○","explanation":"N形では電子が多数キャリア、正孔が少数キャリア。","priority":true},{"id":"Q122","type":"tf","section":"半導体の性質","page":54,"text":"「P形半導体で多数キャリアとなるものは正孔（ホール）である。」","answer":true,"answerText":"○","explanation":"P形では正孔が多数キャリア、電子が少数キャリア。","priority":true},{"id":"Q123","type":"tf","section":"半導体の性質","page":54,"text":"「真性半導体に微量の不純物を加える主目的は絶縁体にするためである。」","answer":false,"answerText":"×","explanation":"不純物濃度により伝導電子または正孔の量を制御できる。","priority":true},{"id":"Q124","type":"tf","section":"半導体の性質","page":54,"text":"「N形半導体を作るためSiに加える代表的な不純物はリンなどの5価元素である。」","answer":true,"answerText":"○","explanation":"5価元素は余分な電子を供給するドナーとなる。","priority":true},{"id":"Q125","type":"tf","section":"半導体の性質","page":54,"text":"「P形半導体を作るためSiに加える代表的な不純物はホウ素などの3価元素である。」","answer":true,"answerText":"○","explanation":"3価元素は正孔を生じさせるアクセプタとなる。","priority":true},{"id":"Q126","type":"tf","section":"半導体の性質","page":54,"text":"「共有結合から電子が抜けた空席を何と呼ぶか。」","answer":false,"answerText":"×","explanation":"正孔は正電荷のように振る舞い、電界方向へ移動する。","priority":true},{"id":"Q127","type":"tf","section":"PN接合","page":55,"text":"「PN接合に順方向電圧を加えたときの状態として正しいものは障壁が低くなり電流が流れるである。」","answer":true,"answerText":"○","explanation":"P側を正、N側を負にするとキャリアが接合面を越える。","priority":true},{"id":"Q128","type":"tf","section":"PN接合","page":55,"text":"「PN接合に逆方向電圧を加えたときの基本動作はごく小さな電流を除き電流を流さないである。」","answer":true,"answerText":"○","explanation":"逆方向では空乏層が広がり、通常はほとんど電流が流れない。","priority":true},{"id":"Q129","type":"tf","section":"トランジスタ基礎","page":56,"text":"「NPNトランジスタの3領域の並びはP-N-Pである。」","answer":false,"answerText":"×","explanation":"中央の薄い領域がベース、両側がエミッタとコレクタ。","priority":true},{"id":"Q130","type":"tf","section":"トランジスタ基礎","page":56,"text":"「バイポーラトランジスタの端子名の組合せはエミッタ・ベース・コレクタである。」","answer":true,"answerText":"○","explanation":"端子はE、B、Cで表す。","priority":true},{"id":"Q131","type":"tf","section":"トランジスタ基礎","page":56,"text":"「増幅回路で最も一般的で、入出力に共通となる端子がエミッタの接続はエミッタ接地回路である。」","answer":true,"answerText":"○","explanation":"エミッタ接地は電圧・電流・電力増幅が得られ、広く使われる。","priority":true},{"id":"Q132","type":"tf","section":"接合ダイオード","page":57,"text":"「一般にSiダイオードがGeダイオードより優れる点は順方向立上り電圧が必ず低いである。」","answer":false,"answerText":"×","explanation":"SiはGeより耐圧・耐熱性に優れ、広く使われる。","priority":true},{"id":"Q133","type":"tf","section":"接合ダイオード","page":57,"text":"「大容量の接合ダイオードを電力整流に用いるときの名称は電力用ダイオード（整流器）である。」","answer":true,"answerText":"○","explanation":"大電流を扱うものは電力整流器に使われる。","priority":false},{"id":"Q134","type":"tf","section":"特殊ダイオード","page":58,"text":"「ツェナー降伏を利用するダイオードは定電圧ダイオードである。」","answer":true,"answerText":"○","explanation":"逆方向電圧を一定に保つ性質を定電圧回路に利用する。","priority":true},{"id":"Q135","type":"tf","section":"特殊ダイオード","page":58,"text":"「エサキダイオードの特徴として正しいものは光を受けて発電するである。」","answer":false,"answerText":"×","explanation":"トンネル効果による負性抵抗領域をもち、高周波発振などに使う。","priority":true},{"id":"Q136","type":"tf","section":"特殊ダイオード","page":59,"text":"「可変容量ダイオードで容量を変えるために用いるものは逆方向バイアス電圧である。」","answer":true,"answerText":"○","explanation":"空乏層幅が逆電圧で変わり、接合容量が変化する。","priority":true},{"id":"Q137","type":"tf","section":"特殊ダイオード","page":59,"text":"「可変容量ダイオードの代表的用途は電子同調・FM変調である。」","answer":true,"answerText":"○","explanation":"高周波回路で電圧制御容量として使われる。","priority":true},{"id":"Q138","type":"tf","section":"FET","page":61,"text":"「接合形FETで電流を制御する端子はベースである。」","answer":false,"answerText":"×","explanation":"ゲート電圧でチャネル幅を変え、ドレイン電流を制御する。","priority":true},{"id":"Q139","type":"tf","section":"FET","page":61,"text":"「FETがバイポーラトランジスタと異なる代表的な呼び方は電圧制御素子である。」","answer":true,"answerText":"○","explanation":"ゲート電圧によって出力電流を制御する。","priority":true},{"id":"Q140","type":"tf","section":"FET","page":61,"text":"「接合形FETのゲートにほとんど電流が流れないため得られる特徴は入力インピーダンスが高いである。」","answer":true,"answerText":"○","explanation":"ゲート接合を逆バイアスして用いる。","priority":true},{"id":"Q141","type":"tf","section":"パワー半導体","page":63,"text":"「パワーMOSFETが特に用いられる領域として適切なのは低周波の機械接点だけである。」","answer":false,"answerText":"×","explanation":"高速・低損失の電力スイッチに向く。","priority":true},{"id":"Q142","type":"tf","section":"パワー半導体","page":63,"text":"「IGBTはどの組合せの素子か。」","answer":true,"answerText":"○","explanation":"絶縁ゲートバイポーラトランジスタで、電力制御に使う。","priority":true},{"id":"Q143","type":"tf","section":"集積回路","page":64,"text":"「ICの利点として不適切なものは個別部品より修理交換が容易であるである。」","answer":true,"answerText":"○","explanation":"IC内部は個々の部品単位で交換しにくい。","priority":true},{"id":"Q144","type":"tf","section":"集積回路","page":65,"text":"「1枚の半導体基板上に全素子を一体形成したICはハイブリッドICである。」","answer":false,"answerText":"×","explanation":"同一シリコン結晶基板に素子を作り込む。","priority":true},{"id":"Q145","type":"tf","section":"集積回路","page":65,"text":"「絶縁基板上に膜部品と個別半導体などを組み合わせたICはハイブリッドICである。」","answer":true,"answerText":"○","explanation":"異種材料・素子を組み合わせやすい。","priority":true},{"id":"Q146","type":"tf","section":"集積回路","page":65,"text":"「ハイブリッドICの利点として適切なのは高電圧・大出力や異種素子の組合せに対応しやすいである。」","answer":true,"answerText":"○","explanation":"抵抗・コンデンサ・半導体などを目的に応じて組み合わせる。","priority":true},{"id":"Q147","type":"tf","section":"論理IC","page":67,"text":"「ショットキーTTLでSBDを付加する主目的は消費電力を必ず0にするである。」","answer":false,"answerText":"×","explanation":"蓄積時間を減らし、切替えを速くする。","priority":true},{"id":"Q148","type":"tf","section":"論理IC","page":67,"text":"「ECLの特徴として正しいものは動作速度が非常に速いが消費電力が大きいである。」","answer":true,"answerText":"○","explanation":"非飽和動作を利用して高速だが、電力を多く消費する。","priority":true},{"id":"Q149","type":"tf","section":"論理IC","page":67,"text":"「IILの特徴として適切なのは消費電力が非常に小さく高集積化しやすいである。」","answer":true,"answerText":"○","explanation":"電流注入形論理で、微小電力・小面積に向く。","priority":true},{"id":"Q150","type":"tf","section":"MOS IC","page":67,"text":"「MOS ICの長所として適切なのは動作速度が必ずECLより速いである。」","answer":false,"answerText":"×","explanation":"製造プロセスが簡単で高集積化しやすい。","priority":true},{"id":"Q151","type":"tf","section":"MOS IC","page":67,"text":"「NチャネルMOSがPチャネルMOSより高速になりやすい主因は電子の移動度が正孔より大きいである。」","answer":true,"answerText":"○","explanation":"電子キャリアの移動度が高い。","priority":true},{"id":"Q152","type":"tf","section":"MOS IC","page":68,"text":"「CMOSの基本構成はPチャネルMOSとNチャネルMOSの相補接続である。」","answer":true,"answerText":"○","explanation":"相補形MOSで、一方がオンのとき他方がオフになる。","priority":true},{"id":"Q153","type":"tf","section":"MOS IC","page":68,"text":"「CMOSの最も代表的な長所は製造工程が最も単純である。」","answer":false,"answerText":"×","explanation":"定常時は上下のどちらかがオフで直流経路がほぼない。","priority":true},{"id":"Q154","type":"tf","section":"MOS IC","page":68,"text":"「CMOSの短所として適切なのは静電気に弱いである。」","answer":true,"answerText":"○","explanation":"薄いゲート酸化膜が静電破壊を受けやすい。","priority":true},{"id":"Q155","type":"tf","section":"特殊半導体","page":69,"text":"「バリスタの主な用途は過電圧・サージ吸収である。」","answer":true,"answerText":"○","explanation":"電圧で抵抗値が大きく変わる非線形抵抗素子。","priority":true},{"id":"Q156","type":"tf","section":"特殊半導体","page":69,"text":"「サイリスタが導通を開始するきっかけは光だけである。」","answer":false,"answerText":"×","explanation":"順方向電圧下でゲート電流を与えると導通する。","priority":true},{"id":"Q157","type":"tf","section":"可変抵抗器","page":74,"text":"「可変抵抗器でコンデンサの放電経路を作る用途は放電用抵抗である。」","answer":true,"answerText":"○","explanation":"蓄積電荷を安全に逃がす。","priority":true},{"id":"Q158","type":"tf","section":"コンデンサ材料","page":75,"text":"「アルミ電解コンデンサの特徴として正しいものは大容量だが極性があり耐圧は比較的低いである。」","answer":true,"answerText":"○","explanation":"電解液と酸化被膜を使い、大容量化できる。","priority":true},{"id":"Q159","type":"tf","section":"コンデンサ材料","page":75,"text":"「タンタル電解コンデンサの特徴は無極性であるである。」","answer":false,"answerText":"×","explanation":"極性をもつため逆接続に注意する。","priority":true},{"id":"Q160","type":"tf","section":"コンデンサ材料","page":75,"text":"「セラミックコンデンサが高周波でよく使われる理由は小形で誘電損失が小さいである。」","answer":true,"answerText":"○","explanation":"数pF～数µFで高周波回路に使う。","priority":true},{"id":"Q161","type":"tf","section":"コンデン }];const KEY='electronics-quiz-200-v1';let state=JSON.parse(localStorage.getItem(KEY)||'{}'),filter='all',order=QUESTIONS.map(q=>q.id);const byId=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s||'').normalize('NFKC').replace(/[\s・（）()、。]/g,'').toLowerCase();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function answer(q,st){return `<div class="result ${st.correct?'ok':'ng'}"><b>${st.correct?'正解。':'正解：'+esc(q.answerText)}</b><div class="explain">${esc(q.explanation)}</div><div class="source">本文 p.${q.page}</div></div>`}function grade(id,reveal=false){const q=byId[id],s=state[id]||{};let ok=false;if(!reveal){if(q.type==='choice')ok=Number(s.value)===q.answer;else if(q.type==='tf')ok=String(s.value)===String(q.answer);else ok=(q.aliases||[]).some(a=>norm(a)===norm(s.value));}state[id]={...s,checked:true,correct:ok,revealed:reveal};save();render()}function render(){const root=document.getElementById('quiz');root.innerHTML='';const sec=document.getElementById('section').value,typ=document.getElementById('type').value;let last='';for(const id of order){const q=byId[id],s=state[id]||{};let show=filter==='all'||filter==='priority'&&q.priority||filter==='wrong'&&s.checked&&!s.correct||filter==='unanswered'&&!s.checked;if(sec!=='all'&&q.section!==sec)show=false;if(typ!=='all'&&q.type!==typ)show=false;if(!show)continue;if(q.section!==last){const h=document.createElement('h2');h.className='section-title';h.textContent=q.section;root.appendChild(h);last=q.section}const c=document.createElement('article');c.className='card'+(s.checked?(s.correct?' correct':' wrong'):'');let body='';if(q.type==='choice')body='<div class="choices">'+q.choices.map((x,i)=>`<button class="choice ${String(s.value)===String(i)?'selected':''}" data-pick="${i}">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('')+'</div>';else if(q.type==='tf')body=`<div class="choices"><button class="choice ${String(s.value)==='true'?'selected':''}" data-pick="true">○ 正しい</button><button class="choice ${String(s.value)==='false'?'selected':''}" data-pick="false">× 誤り</button></div>`;else body=`<input class="short" value="${esc(s.value||'')}" placeholder="用語または要点を入力">`;c.dataset.id=id;c.innerHTML=`<div class="meta"><span>${id}</span><span class="badge">${q.type==='choice'?'4択':q.type==='tf'?'○×':'記述'}</span>${q.priority?'<span class="badge priority">重点</span>':''}<span>本文 p.${q.page}</span></div><div class="question">${esc(q.text)}</div>${body}<div class="actions"><button class="check primary">判定</button><button class="reveal">答えを見る</button></div>${s.checked?answer(q,s):''}`;root.appendChild(c)}update()}function update(){let a=0,ok=0;QUESTIONS.forEach(q=>{const s=state[q.id];if(s?.checked){a++;if(s.correct)ok++}});score.textContent=`${ok} / ${QUESTIONS.length} 正解`;answered.textContent=`${a}問回答`;bar.style.width=`${a/QUESTIONS.length*100}%`}document.addEventListener('click',e=>{const c=e.target.closest('.card');if(e.target.dataset.pick!==undefined&&c){state[c.dataset.id]={...(state[c.dataset.id]||{}),value:e.target.dataset.pick};save();render()}if(e.target.classList.contains('check')&&c){const q=byId[c.dataset.id];if(q.type==='short'){state[q.id]={...(state[q.id]||{}),value:c.querySelector('.short').value}}grade(c.dataset.id)}if(e.target.classList.contains('reveal')&&c)grade(c.dataset.id,true);if(e.target.dataset.filter){filter=e.target.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===e.target));render()}});[section,type].forEach(x=>x.onchange=render);[...new Set(QUESTIONS.map(q=>q.section))].forEach(x=>section.add(new Option(x,x)));shuffle.onclick=()=>{for(let i=order.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}render();scrollTo({top:0,behavior:'smooth'})};restore.onclick=()=>{order=QUESTIONS.map(q=>q.id);render()};reset.onclick=()=>{if(confirm('すべての解答履歴を消しますか？')){state={};localStorage.removeItem(KEY);render()}};const counts={};QUESTIONS.forEach(q=>counts[q.section]=(counts[q.section]||0)+1);coverage.innerHTML=Object.entries(counts).map(([k,v])=>`<div>✓ ${esc(k)}：${v}問</div>`).join('');render();
